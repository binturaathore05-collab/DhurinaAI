<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveTeach · Teacher Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F6F7F9; --panel:#FFFFFF; --surf:#F1F3F6; --border:#E3E6EB; --text:#111827; --muted:#5B6472;
          --acc:#0F766E; --accHover:#115E59; --accSoft:#E6F4F1; --warn:#B45309; --warnSoft:#FEF3C7; --ok:#15803D; --bad:#B91C1C; }
  * { box-sizing: border-box; }
  /* Always light: stops phones/browsers in dark mode from turning control text white on our white boxes */
  :root { color-scheme: light; }
  button, input, select, textarea, option { color: var(--text); }
  input::placeholder, textarea::placeholder { color: #8A93A3; opacity: 1; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14px; }
  a { color: var(--acc); } a:hover { color: var(--accHover); }
  .shell { display: flex; flex-wrap: wrap; min-height: 100vh; }
  nav { flex: 1 1 250px; max-width: 270px; background: #fff; border-right: 1px solid var(--border); padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; }
  .me { display: flex; gap: 10px; align-items: center; padding: 0 8px 20px; }
  .me img, .av { width: 42px; height: 42px; border-radius: 999px; object-fit: cover; object-position: center 15%; background: var(--surf); flex: none; }
  nav a.item { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 14px; border-radius: 12px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 15px; white-space: nowrap; }
  nav a.item.on { background: var(--surf); color: var(--text); }
  nav .badge { margin-left: auto; background: var(--warn); color: #fff; font-size: 11px; font-weight: 800; border-radius: 999px; padding: 2px 8px; }
  nav .spacer { flex: 1; }
  main { flex: 999 1 560px; min-width: 0; padding: 30px 36px 48px; display: flex; flex-direction: column; gap: 22px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; } h2 { margin: 0; font-size: 17px; }
  .sub { color: var(--muted); font-size: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 16px; border-radius: 12px; font: inherit; font-weight: 800; border: 0; cursor: pointer; text-decoration: none; }
  .btn.primary { background: var(--acc); color: #fff; } .btn.primary:hover { background: var(--accHover); color: #fff; }
  .btn.ghost { background: #fff; color: var(--text); border: 1.5px solid var(--border); }
  .btn.small { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
  .btn.danger { background: #fff; color: var(--bad); border: 1.5px solid #F3C4C4; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 1px 2px rgba(16,24,40,.05); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
  .stat { background: #fff; border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 1px 2px rgba(16,24,40,.05); padding: 18px; display: flex; flex-direction: column; gap: 6px; }
  .stat .k { color: var(--muted); font-size: 13px; } .stat .v { font-size: 26px; font-weight: 800; } .stat .n { color: var(--muted); font-size: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; border: 1.5px solid currentColor; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 999px; background: currentColor; }
  .drop { border: 2px dashed #B9C2CE; border-radius: 16px; background: var(--surf); padding: 28px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; cursor: pointer; }
  .drop.over { border-color: var(--acc); background: var(--accSoft); }
  .types { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .types span { background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .list > div { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--border); }
  .ficon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 11px; font-weight: 800; flex: none; }
  .grow { flex: 1; min-width: 0; } .grow b, .grow span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs button { height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--border); background: #fff; font: inherit; font-weight: 700; cursor: pointer; color: var(--muted); }
  .tabs button.on { background: var(--text); color: #fff; border-color: var(--text); }
  .qa { border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #fff; }
  .qa .q { font-weight: 800; font-size: 15px; }
  .qa .a { background: var(--surf); border-radius: 10px; padding: 12px; line-height: 1.5; white-space: pre-wrap; }
  .qa textarea { width: 100%; min-height: 110px; border-radius: 10px; border: 1.5px solid var(--acc); padding: 10px 12px; font: inherit; line-height: 1.5; outline: none; }
  .style-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .trait { border: 1px solid var(--border); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: #fff; }
  .trait textarea { width: 100%; min-height: 96px; border: 1.5px solid var(--border); border-radius: 10px; padding: 8px 10px; font: inherit; resize: vertical; outline: none; }
  .trait textarea:focus { border-color: var(--acc); }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .pcard { text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 14px; border: 2px solid var(--border); background: #fff; font: inherit; cursor: pointer; color: var(--text); }
  .pcard.on { border-color: var(--acc); background: var(--accSoft); }
  .rank { background: var(--acc); color: #fff; font-size: 11px; font-weight: 800; border-radius: 999px; padding: 2px 8px; }
  .pager { display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .pager button { min-width: 38px; height: 36px; border-radius: 10px; border: 1.5px solid var(--border); background: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .pager button.on { background: var(--text); color: #fff; border-color: var(--text); } .pager button:disabled { opacity: .4; cursor: default; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  select { height: 40px; border-radius: 12px; border: 1.5px solid var(--border); background: #fff; font: inherit; padding: 0 10px; }
  .qa input[type=checkbox], th input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--acc); }
  .chipf { height: 34px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--border); background: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .chipf.on { background: var(--text); color: #fff; border-color: var(--text); }
  .modal { position: fixed; inset: 0; background: rgba(17,24,39,.45); display: grid; place-items: center; padding: 20px; z-index: 8; }
  .modal .card { max-width: 900px; width: 100%; max-height: 90vh; overflow: auto; }
  .toggle { position: relative; width: 44px; height: 26px; flex: none; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle span { position: absolute; inset: 0; border-radius: 999px; background: #CBD2DC; cursor: pointer; transition: .15s; }
  .toggle span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 999px; background: #fff; transition: .15s; }
  .toggle input:checked + span { background: var(--acc); } .toggle input:checked + span::after { left: 21px; }
  .toggle input:focus-visible + span { outline: 2px solid var(--acc); outline-offset: 2px; }
  input[type=text], input[type=email], input[type=password], input[type=url], input[type=search] { height: 44px; border-radius: 12px; border: 1.5px solid var(--border); background: #fff; color: var(--text); padding: 0 14px; font: inherit; outline: none; }
  input:focus { border-color: var(--acc); }
  label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .yt { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .yt .logo { width: 56px; height: 56px; border-radius: 14px; background: #FEE2E2; color: #B91C1C; display: grid; place-items: center; font-weight: 800; }
  table { width: 100%; border-collapse: collapse; min-width: 560px; }
  th { text-align: left; font-size: 12px; color: var(--muted); letter-spacing: .04em; padding: 10px 12px; }
  td { padding: 12px; border-top: 1px solid var(--border); }
  .scroll { overflow-x: auto; }
  .bars { display: flex; gap: 14px; align-items: flex-end; height: 180px; }
  .bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; justify-content: flex-end; height: 100%; }
  .bars .b div { width: 100%; max-width: 46px; background: var(--acc); border-radius: 8px 8px 0 0; min-height: 2px; }
  .muted { color: var(--muted); } .err { color: var(--bad); font-weight: 600; }
  .toastbtn { margin-left: 14px; background: #fff; color: var(--text); border: 0; border-radius: 8px; padding: 6px 12px; font: inherit; font-weight: 800; cursor: pointer; }
  .toast { position: fixed; right: 20px; bottom: 20px; background: var(--text); color: #fff; padding: 12px 16px; border-radius: 12px; font-weight: 600; z-index: 9; }
  .login { max-width: 400px; margin: 12vh auto; }
  .note { background: var(--accSoft); color: #134E4A; border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.5; }
  .progress { height: 6px; border-radius: 999px; background: var(--surf); overflow: hidden; } .progress div { height: 100%; background: var(--acc); }
  @media (max-width: 700px) { main { padding: 20px 16px; } nav { max-width: none; } }
</style>
</head>

<div id="app"></div>
<input id="filepick" type="file" multiple accept=".pdf,.doc,.docx,.txt,.jpg,.jpeg,.png,.mp3,.m4a,.wav,.mp4,.mov" style="display:none">
<script>

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rupees = (p) => '₹' + Math.round((p || 0) / 100).toLocaleString('en-IN');
const ago = (ts) => { const s = (Date.now() - ts) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago'; if (s < 86400) return Math.floor(s / 3600) + ' h ago'; return Math.floor(s / 86400) + ' days ago'; };
function toast(m, actionLabel, action) {
  document.querySelectorAll('.toast').forEach((x) => x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = m;
  if (actionLabel) { const b = document.createElement('button'); b.textContent = actionLabel; b.className = 'toastbtn';
    b.onclick = () => { t.remove(); action(); }; t.append(b); }
  document.body.append(t); setTimeout(() => t.remove(), actionLabel ? 10000 : 3000); }
const ICON = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>', book: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>',
  yt: '<rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z"/>', spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
  check: '<path d="M5 12l5 5 9-10"/>', users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
  out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>', up: '<path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M5 20h14"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>', mic: '<path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/>',
};
const icon = (n, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const FT = { pdf: ['PDF', '#FEE2E2', '#B91C1C'], doc: ['DOC', '#DBEAFE', '#1D4ED8'], img: ['IMG', '#FCE7F3', '#9D174D'], audio: ['AUD', '#EDE9FE', '#5B21B6'], video: ['VID', '#FFEDD5', '#9A3412'], text: ['TXT', '#E6F4F1', '#0F766E'], yt: ['YT', '#FEE2E2', '#B91C1C'] };
const kindOf = (name) => { const e = name.split('.').pop().toLowerCase();
  return e === 'pdf' ? 'pdf' : ['doc', 'docx'].includes(e) ? 'doc' : ['jpg', 'jpeg', 'png'].includes(e) ? 'img' : ['mp3', 'm4a', 'wav'].includes(e) ? 'audio' : ['mp4', 'mov'].includes(e) ? 'video' : 'text'; };
const STATUS = { ready: ['Ready', 'var(--ok)'], processing: ['Processing…', 'var(--warn)'], failed: ['Failed', 'var(--bad)'], queued: ['Waiting', 'var(--muted)'] };
const pill = (st) => { const [t, c] = STATUS[st] || STATUS.queued; return `<span class="pill" style="color:${c}">${t}</span>`; };

// ------------------------------- DEMO DATA ---------------------------------------
const DEMO = (() => {
  const now = Date.now(), H = 3600e3, D = 24 * H;
  const db = {

      { id: 4, name: 'Current affairs – October lecture.mp3', kind: 'audio', status: 'processing', points: 0, lang: '—', at: now - 0.3 * H, size: '46 MB', progress: 60 },

    yt: { connected: true, channel: 'Subhash Sir Classes', subs: '[N] subscribers', autosync: true, lastSync: now - 2 * H,
      playlists: [{ name: 'Rajasthan History (Full Course)', on: true, n: 42 }, { name: 'Rajasthan Geography', on: true, n: 31 }, { name: 'Daily Current Affairs', on: false, n: 120 }, { name: 'Motivation', on: false, n: 15 }],

        { title: 'Haldighati ka Yuddh – poori kahani', status: 'ready', note: 'Learned · 28 points', at: now - 2 * H },
        { title: 'Maharana Pratap ke 10 important facts', status: 'ready', note: 'Learned · 19 points', at: now - D },
        { title: 'Chambal Nadi – udgam se sangam tak', status: 'ready', note: 'Learned · 23 points', at: now - 2 * D },

      interaction: { ask_questions: true, wait_for_answer: true, praise: true, correct_politely: true, motivate: true, use_name: true, adapt_level: true, natural_talk: true },
      avatar: { expressions: true, gestures: true, eye_contact: true, look_at_board: true, voice_emotion: true, lip_sync: true, continuity: true } },
    reviewGroups: (() => {   // ~500 waiting answers about 150 distinct questions
      const base = [['इस महीने राजस्थान में कौन-सी नई योजना शुरू हुई?', 'यह जवाब भरोसेमंद सरकारी साइटों से लिया गया है: …', 'Internet · pib.gov.in', 'Hindi'],
        ['What is the difference between a lake and a reservoir?', 'A lake is natural; a reservoir is usually man-made, created by a dam…', 'General AI', 'English'],
        ['Sir, Rajasthan ka sabse ooncha shikhar kaunsa hai?', 'Guru Shikhar (Mount Abu, Sirohi), Aravali mein, lagbhag 1722 metre.', 'General AI', 'Hinglish'],
        ['Ghoomar nritya kis kshetra ka hai?', 'Ghoomar Rajasthan ka lok nritya hai, khaaskar Bhil aur Rajput samuday se juda…', 'General AI', 'Hinglish'],
        ['RAS exam mein kitne paper hote hain?', 'RAS Mains mein 4 paper hote hain…', 'Internet · rpsc.rajasthan.gov.in', 'Hinglish']];
      const g = []; let id = 1000;

        g.push({ ids: [...Array(asked)].map(() => id++), question: k < 5 ? b[0] : b[0].replace('?', '') + ' (' + (k + 1) + ')?', answer: b[1], source: b[2], language: b[3], asked, at: now - k * 0.4 * H }); }

    approvedGroups: [{ ids: [9], question: 'Chetak kaun tha?', answer: 'Chetak Maharana Pratap ka vafadar ghoda tha…', asked: 12, at: now - 2 * D, source: 'General AI', language: 'Hinglish', verified_id: 9 }],

// ---------- shared pager ----------
function pager(total, offset, limit, attr) {
  const pages = Math.max(1, Math.ceil(total / limit)), cur = Math.floor(offset / limit) + 1;
  const nums = [...new Set([1, cur - 1, cur, cur + 1, pages])].filter((n) => n >= 1 && n <= pages).sort((a, b) => a - b);
  let out = '', last = 0;
  for (const n of nums) { if (n - last > 1) out += '<span class="muted">…</span>'; out += `<button type="button" class="${n === cur ? 'on' : ''}" ${attr}="${(n - 1) * limit}" aria-label="Page ${n}">${n}</button>`; last = n; }
  return `<div class="row"><span class="muted">Showing ${total ? offset + 1 : 0}–${Math.min(offset + limit, total)} of ${total.toLocaleString('en-IN')}</span>
    <div class="pager"><button type="button" ${attr}="${Math.max(0, offset - limit)}" ${cur === 1 ? 'disabled' : ''}>‹ Prev</button>${out}<button type="button" ${attr}="${offset + limit}" ${cur === pages ? 'disabled' : ''}>Next ›</button></div></div>`;
}

  const c = r.counts, all = c.active + c.ending + c.ended + c.demo;
  const f = (k, label, n) => `<button type="button" class="chipf ${SV.status === k ? 'on' : ''}" data-st="${k}">${label} · ${n.toLocaleString('en-IN')}</button>`;
  const rows = r.items.map((x) => { const [t, col] = SST[x.status];
    return `<tr><td><b>${esc(x.name || 'Student')}</b><div class="muted" style="font-size:12px">${esc(x.phone)}</div></td><td>${esc(x.plan)}</td><td><span class="pill" style="color:${col}">${t}</span></td>
      <td>${dt(x.valid_till)}</td><td>${dt(x.joined)}</td><td>${ago(x.last_active)}</td><td>${x.questions}</td><td>${x.notes}</td><td style="text-transform:capitalize">${esc(x.level)}</td>
      <td>${rupees(x.paid_paise)}${x.renewals ? `<div class="muted" style="font-size:11px">${x.renewals} renewal${x.renewals > 1 ? 's' : ''}</div>` : ''}</td></tr>`; }).join('');
  const months = [...Array(12)].map((_, i) => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); const v = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    return `<option value="${v}">${d.toLocaleString('en', { month: 'long', year: 'numeric' })}</option>`; }).join('');
  const max = Math.max(1, ...D.months), labels = [...Array(6)].map((_, i) => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 5 + i); return d.toLocaleString('en', { month: 'short' }); });
  const bars = D.months.map((m, i) => `<div class="b"><div style="height:${Math.round(m / max * 140)}px" title="${rupees(m * D.me.split / 100)}"></div><span class="muted" style="font-size:12px">${labels[i]}</span></div>`).join('');
  return shell('students', `${head('Students & Earnings', 'Your share is ' + D.me.split + '%. Razorpay settles it to your bank account automatically.')}
    <section class="card"><div class="row"><div><h2>Monthly report</h2><span class="sub">Subscriptions, new vs renewals, total received and your earnings — for your own accounts.</span></div>
      <div class="toolbar"><select id="rm" aria-label="Month">${months}</select><button class="btn ghost small" id="rv">View</button><button class="btn primary small" data-dl="xlsx">Download Excel</button><button class="btn primary small" data-dl="pdf">Download PDF</button></div></div>
      <div class="bars">${bars}</div></section>
    <section class="card" style="gap:12px"><div class="row"><h2>Students</h2><input type="search" id="sq" value="${esc(SV.q)}" placeholder="Search name or last 4 digits" aria-label="Search students" style="min-width:260px"></div>
      <div class="toolbar">${f('', 'All', all)}${f('active', 'Active', c.active)}${f('ending', 'Ends in 3 days', c.ending)}${f('ended', 'Plan ended', c.ended)}${f('demo', 'Demo only', c.demo)}</div>
      <span class="muted" style="font-size:12px">Phone numbers are hidden to protect students’ privacy. Students whose plan ends soon get a renew reminder automatically.</span>
      <div class="scroll"><table style="min-width:980px"><thead><tr><th>STUDENT</th><th>PLAN</th><th>STATUS</th><th>VALID TILL</th><th>JOINED</th><th>LAST ACTIVE</th><th>QUESTIONS</th><th>NOTES SAVED</th><th>LEVEL</th><th>PAID</th></tr></thead><tbody>${rows || '<tr><td colspan="10" class="muted">No students found.</td></tr>'}</tbody></table></div>
      ${pager(r.total, SV.offset, SV.limit, 'data-sp')}</section>`);
}

async function showReport(month) {
  const r = await api('GET', '/report?month=' + month), s = r.summary;
  const rows = r.items.map((i) => `<tr><td>${esc(i.date)}</td><td>${esc(i.student)}</td><td>${esc(i.plan)}</td><td>${esc(i.type)}</td><td>${rupees(i.amount_paise)}</td><td>${i.your_percent}%</td><td><b>${rupees(i.your_paise)}</b></td></tr>`).join('');
  const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-label', 'Monthly report');
  m.innerHTML = `<div class="card"><div class="row"><div><h2>${esc(r.teacher)} — earnings report</h2><b>Period: ${esc(r.period_from)} to ${esc(r.period_to)}</b><div class="sub">Generated on ${esc(r.generated_on)} · before payment-gateway fees</div></div><button class="btn ghost small" id="mx">Close</button></div>
    <div class="stats">${stat('Subscriptions', s.subscriptions, s.new + ' new · ' + s.renewals + ' renewals')}${stat('Total paid', rupees(s.gross_paise), 'by your students')}${stat('Your share', s.your_percent + '%', 'of every payment')}${stat('Your earnings', rupees(s.your_paise), 'settled by Razorpay')}</div>
    <div class="scroll"><table><thead><tr><th>DATE</th><th>STUDENT</th><th>PLAN</th><th>TYPE</th><th>AMOUNT</th><th>YOUR SHARE</th><th>YOUR EARNINGS</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  document.body.append(m); m.onclick = (e) => { if (e.target === m || e.target.id === 'mx') m.remove(); };
}
async function download(fmt, month) {
  if (IS_DEMO) { toast(`In your live dashboard this downloads ${month}.${fmt}. Here is the report preview.`); return showReport(month); }
  const res = await fetch(`/teacher/report?month=${month}&format=${fmt}`, { headers: AUTH() });
  if (!res.ok) return toast('Could not create the report');
  const a = document.createElement('a'); a.href = URL.createObjectURL(await res.blob()); a.download = `liveteach-${month}.${fmt}`; a.click();
}

function settingsView() {
  return shell('settings', `${head('Settings', 'Your profile and login.')}
    <section class="card"><div class="row" style="justify-content:flex-start;gap:16px">${D.me.avatar ? `<img class="av" style="width:64px;height:64px" src="${D.me.avatar}" alt="">` : ''}<div><b style="font-size:17px">${esc(D.me.name)}</b><div class="muted">${esc(D.me.subjects)}</div><div class="muted">App: ${esc(D.me.app)}</div></div></div>
      <span class="muted" style="font-size:12px">To change your name, photo, subjects, prices or your share, contact LiveTeach support.</span></section>
    <section class="card"><h2>Change password</h2><div class="grid2"><label class="f">Current password<input id="p0" type="password" autocomplete="current-password"></label><label class="f">New password<input id="p1" type="password" autocomplete="new-password"></label></div>
      <div class="row"><span id="pm" class="muted"></span><button class="btn ghost" id="pb">Change password</button></div></section>`);
}

// ------------------------------- WIRING ------------------------------------------
async function uploadFiles(files) { for (const f of files) { await api('POST', '/files', { name: f.name, size: (f.size / 1048576).toFixed(1) + ' MB' }); } toast(files.length + ' file(s) added — your AI is learning them'); render(); }
function bind(view) {
  if (view === 'knowledge') {
    const drop = $('#drop'), pick = $('#filepick');
    drop.onclick = () => pick.click(); drop.onkeydown = (e) => (e.key === 'Enter' || e.key === ' ') && pick.click();
    pick.onchange = () => { uploadFiles([...pick.files]); pick.value = ''; };
    drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); }; drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); uploadFiles([...e.dataTransfer.files]); };
    $$('[data-del]').forEach((b) => b.onclick = async () => { await api('DELETE', '/files/' + b.dataset.del); toast('Removed — your AI no longer uses this file'); render(); });
    $('#ns').onclick = async () => { const t = $('#nt').value.trim(), x = $('#nb').value.trim(); if (!t || !x) return toast('Add a title and some text');
      await api('POST', '/notes', { title: t, text: x }); toast('Note added'); render(); };
    $('#fq').oninput = (e) => $$('#fl > div').forEach((r) => r.style.display = r.textContent.toLowerCase().includes(e.target.value.toLowerCase()) ? '' : 'none');
  }
  if (view === 'youtube') {
    $('#ytc') && ($('#ytc').onclick = async () => { await api('PUT', '/youtube', { connected: true }); toast('Channel connected'); render(); });
    $('#ytd') && ($('#ytd').onclick = async () => { await api('PUT', '/youtube', { connected: false }); toast('Disconnected — already learned videos stay'); render(); });
    $('#sync') && ($('#sync').onclick = async () => { await api('POST', '/youtube/sync'); toast('Checking for new videos…'); render(); });
    $('#auto') && ($('#auto').onchange = async (e) => { await api('PUT', '/youtube', { autosync: e.target.checked }); toast(e.target.checked ? 'Auto-sync on' : 'Auto-sync off'); });
    $$('[data-pl]').forEach((c) => c.onchange = async () => { D.yt.playlists[+c.dataset.pl].on = c.checked; await api('PUT', '/youtube', { playlists: D.yt.playlists }); toast('Saved'); });
  }
  if (view === 'style') {
    const S = D.style;
    $$('[data-p]').forEach((b) => b.onclick = () => { const k = b.dataset.p, i = S.personalities.indexOf(k);
      if (i >= 0) { if (S.personalities.length > 1) S.personalities.splice(i, 1); else return toast('Keep at least one personality'); }
      else if (S.personalities.length >= 3) return toast('Up to 3 personalities — remove one first'); else S.personalities.push(k);
      render(); });
    $('#ss').onclick = async () => {
      for (const k in S.teaching) { S.teaching[k].text = $(`[data-tx="${k}"]`).value; S.teaching[k].on = $(`[data-on="${k}"]`).checked; }
      $$('[data-it]').forEach((c) => S.interaction[c.dataset.it] = c.checked);
      $$('[data-av]').forEach((c) => S.avatar[c.dataset.av] = c.checked);
      await api('PUT', '/style', S); toast('Style saved — your AI will follow it'); };
  }
  if (view === 'review') {
    const re = () => { RV.offset = 0; render(); };
    $$('[data-tab]').forEach((b) => b.onclick = () => { RV.tab = b.dataset.tab; RV.sel.clear(); re(); });
    let t; $('#rq').oninput = (e) => { clearTimeout(t); t = setTimeout(() => { RV.q = e.target.value; re(); }, 350); };
    $('#ro').onchange = (e) => { RV.origin = e.target.value; re(); }; $('#rs').onchange = (e) => { RV.sort = e.target.value; re(); };
    $$('[data-rp]').forEach((b) => b.onclick = () => { RV.offset = +b.dataset.rp; render(); window.scrollTo(0, 0); });
    $$('[data-sel]').forEach((c) => c.onchange = () => { c.checked ? RV.sel.add(+c.dataset.sel) : RV.sel.delete(+c.dataset.sel); render(); });
    $('#all') && ($('#all').onchange = (e) => { RV.data.items.forEach((g) => e.target.checked ? RV.sel.add(g.ids[0]) : RV.sel.delete(g.ids[0])); render(); });
    const group = (key) => RV.data.items.find((g) => g.ids[0] === key);
    const decide = async (keys, action, answer) => { const groups = keys.map((k) => group(k)).filter(Boolean);
      const r = await api('POST', '/review/bulk', { decisions: groups.map((g) => ({ ids: g.ids, action, answer })) });
      keys.forEach((k) => RV.sel.delete(k)); RV.editing = null; render();
      toast(`${r.updated} student answer${r.updated === 1 ? '' : 's'} ${action === 'approve' ? 'approved' : 'rejected'}`, 'Undo', async () => {
        for (const g of groups) await api('POST', '/review/undo', { ids: g.ids }); toast('Undone — back in Waiting'); render(); }); };
    $$('[data-undo]').forEach((b) => b.onclick = async () => { const r = await api('POST', '/review/undo', { ids: group(+b.dataset.undo).ids }); toast(`${r.restored} answer${r.restored === 1 ? '' : 's'} moved back to Waiting`); render(); });
    $$('[data-fix]').forEach((b) => b.onclick = async () => { try { await api('PUT', '/verified/' + b.dataset.fix, { answer: $('#ed').value }); RV.editing = null; toast('Approved answer corrected — students get the new version'); render(); } catch (e) { toast(e.message); } });
    $('#bok') && ($('#bok').onclick = () => decide([...RV.sel], 'approve'));
    $('#bno') && ($('#bno').onclick = () => decide([...RV.sel], 'reject'));
    $$('[data-ok]').forEach((b) => b.onclick = () => decide([+b.dataset.ok], 'approve'));
    $$('[data-no]').forEach((b) => b.onclick = () => decide([+b.dataset.no], 'reject'));
    $$('[data-edit]').forEach((b) => b.onclick = () => { RV.editing = +b.dataset.edit; render(); });
    $$('[data-cancel]').forEach((b) => b.onclick = () => { RV.editing = null; render(); });
    $$('[data-save]').forEach((b) => b.onclick = () => decide([+b.dataset.save], 'approve', $('#ed').value));
  }
  if (view === 'students') {
    let t; $('#sq').oninput = (e) => { clearTimeout(t); t = setTimeout(() => { SV.q = e.target.value; SV.offset = 0; render().then(() => $('#sq').focus()); }, 350); };
    $$('[data-st]').forEach((b) => b.onclick = () => { SV.status = b.dataset.st; SV.offset = 0; render(); });
    $$('[data-sp]').forEach((b) => b.onclick = () => { SV.offset = +b.dataset.sp; render(); });
    $('#rv').onclick = () => showReport($('#rm').value);
    $$('[data-dl]').forEach((b) => b.onclick = () => download(b.dataset.dl, $('#rm').value));
  }
  if (view === 'settings') $('#pb').onclick = async () => { try { await api('POST', '/password', { current_password: $('#p0').value, new_password: $('#p1').value }); $('#pm').textContent = 'Password changed'; $('#pm').className = 'muted'; } catch (e) { $('#pm').textContent = e.message; $('#pm').className = 'err'; } };
}

const VIEWS = { home: homeView, knowledge: knowledgeView, youtube: youtubeView, style: styleView, review: reviewView, students: studentsView, settings: settingsView };
async function render() {
  const app = $('#app');
  if (!TOKEN) {
    app.innerHTML = loginView();
    $('#lf').onsubmit = async (e) => { e.preventDefault(); try { TOKEN = (await api('POST', '/login', { login: $('#lg').value, password: $('#pw').value })).token; location.hash = '#home'; render(); } catch (err) { $('#lerr').textContent = err.message; } };
    return;
  }
  const h = (location.hash || '#home').slice(1);
  if (h === 'logout') { TOKEN = ''; location.hash = ''; return render(); }
  D = await api('GET', '/home');
  const view = VIEWS[h] ? h : 'home';
  app.innerHTML = await VIEWS[view]();
  bind(view);
}
window.onhashchange = render;
render();
</script>
</body>
