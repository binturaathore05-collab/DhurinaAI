<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveTeach · Institute panel</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F6F7F9; --panel:#FFFFFF; --surf:#F1F3F6; --border:#E3E6EB; --text:#111827; --muted:#5B6472;
          --acc:#0F766E; --accHover:#115E59; --accSoft:#E6F4F1; --warn:#B45309; --warnSoft:#FEF3C7; --ok:#15803D; --bad:#B91C1C; }
  * { box-sizing: border-box; }
  /* Always light: stops phones/browsers in dark mode from turning control text white on our white boxes */
  :root { color-scheme: only light; }
  button, input, select, textarea, option { color: var(--text); }
  input:not([type=range]):not([type=checkbox]):not([type=radio]):not([type=color]), select, textarea, option { background-color: #fff; -webkit-text-fill-color: var(--text); }
  input:disabled, textarea:disabled, select:disabled { background-color: #F3F4F6; -webkit-text-fill-color: #5B6472; }
  input::placeholder, textarea::placeholder { color: #8A93A3; -webkit-text-fill-color: #8A93A3; opacity: 1; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14px; }
  a { color: var(--acc); } a:hover { color: var(--accHover); }
  .shell { display: flex; flex-wrap: wrap; min-height: 100vh; }
  nav { flex: 1 1 250px; max-width: 270px; background: #fff; border-right: 1px solid var(--border); padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; }
  .me { display: flex; gap: 10px; align-items: center; padding: 0 8px 20px; }
  .me img, .av { width: 42px; height: 42px; border-radius: 999px; object-fit: cover; object-position: center 15%; background: var(--surf); flex: none; }
  nav a.item { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 14px; border-radius: 12px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 15px; white-space: nowrap; }
  nav a.item.on { background: var(--surf); color: var(--text); }
  nav .badge { margin-left: auto; background: var(--warn); color: #fff; font-size: 11px; font-weight: 800; border-radius: 999px; padding: 2px 8px; }
  nav .spacer { flex: 1; }
  main { flex: 999 1 560px; min-width: 0; padding: 30px 36px 48px; display: flex; flex-direction: column; gap: 22px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; } h2 { margin: 0; font-size: 17px; }
  .sub { color: var(--muted); font-size: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 16px; border-radius: 12px; font: inherit; font-weight: 800; border: 0; cursor: pointer; text-decoration: none; }
  .btn.primary { background: var(--acc); color: #fff; } .btn.primary:hover { background: var(--accHover); color: #fff; }
  .btn.ghost { background: #fff; color: var(--text); border: 1.5px solid var(--border); }
  .btn.small { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
  .btn.danger { background: #fff; color: var(--bad); border: 1.5px solid #F3C4C4; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 1px 2px rgba(16,24,40,.05); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
  .stat { background: #fff; border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 1px 2px rgba(16,24,40,.05); padding: 18px; display: flex; flex-direction: column; gap: 6px; }
  .stat .k { color: var(--muted); font-size: 13px; } .stat .v { font-size: 26px; font-weight: 800; } .stat .n { color: var(--muted); font-size: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; border: 1.5px solid currentColor; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 999px; background: currentColor; }
  .drop { border: 2px dashed #B9C2CE; border-radius: 16px; background: var(--surf); padding: 28px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; cursor: pointer; }
  .drop.over { border-color: var(--acc); background: var(--accSoft); }
  .types { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .types span { background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .list > div { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--border); }
  .ficon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 11px; font-weight: 800; flex: none; }
  .grow { flex: 1; min-width: 0; } .grow b, .grow span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs button { height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--border); background: #fff; font: inherit; font-weight: 700; cursor: pointer; color: var(--muted); }
  .tabs button.on { background: var(--text); color: #fff; border-color: var(--text); }
  .qa { border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #fff; }
  .qa .q { font-weight: 800; font-size: 15px; }
  .qa .a { background: var(--surf); border-radius: 10px; padding: 12px; line-height: 1.5; white-space: pre-wrap; }
  .qa textarea { width: 100%; min-height: 110px; border-radius: 10px; border: 1.5px solid var(--acc); padding: 10px 12px; font: inherit; line-height: 1.5; outline: none; }
  .style-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .trait { border: 1px solid var(--border); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: #fff; }
  .trait textarea { width: 100%; min-height: 96px; border: 1.5px solid var(--border); border-radius: 10px; padding: 8px 10px; font: inherit; resize: vertical; outline: none; }
  .trait textarea:focus { border-color: var(--acc); }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .pcard { text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 14px; border: 2px solid var(--border); background: #fff; font: inherit; cursor: pointer; color: var(--text); }
  .pcard.on { border-color: var(--acc); background: var(--accSoft); }
  .rank { background: var(--acc); color: #fff; font-size: 11px; font-weight: 800; border-radius: 999px; padding: 2px 8px; }
  .pager { display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .pager button { min-width: 38px; height: 36px; border-radius: 10px; border: 1.5px solid var(--border); background: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .pager button.on { background: var(--text); color: #fff; border-color: var(--text); } .pager button:disabled { opacity: .4; cursor: default; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  select { height: 40px; border-radius: 12px; border: 1.5px solid var(--border); background: #fff; font: inherit; padding: 0 10px; }
  .qa input[type=checkbox], th input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--acc); }
  .chipf { height: 34px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--border); background: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .chipf.on { background: var(--text); color: #fff; border-color: var(--text); }
  .modal { position: fixed; inset: 0; background: rgba(17,24,39,.45); display: grid; place-items: center; padding: 20px; z-index: 8; }
  .modal .card { max-width: 900px; width: 100%; max-height: 90vh; overflow: auto; }
  .toggle { position: relative; width: 44px; height: 26px; flex: none; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle span { position: absolute; inset: 0; border-radius: 999px; background: #CBD2DC; cursor: pointer; transition: .15s; }
  .toggle span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 999px; background: #fff; transition: .15s; }
  .toggle input:checked + span { background: var(--acc); } .toggle input:checked + span::after { left: 21px; }
  .toggle input:focus-visible + span { outline: 2px solid var(--acc); outline-offset: 2px; }
  input[type=text], input[type=email], input[type=password], input[type=url], input[type=search] { height: 44px; border-radius: 12px; border: 1.5px solid var(--border); background: #fff; color: var(--text); padding: 0 14px; font: inherit; outline: none; }
  input:focus { border-color: var(--acc); }
  label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .yt { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .yt .logo { width: 56px; height: 56px; border-radius: 14px; background: #FEE2E2; color: #B91C1C; display: grid; place-items: center; font-weight: 800; }
  table { width: 100%; border-collapse: collapse; min-width: 560px; }
  th { text-align: left; font-size: 12px; color: var(--muted); letter-spacing: .04em; padding: 10px 12px; }
  td { padding: 12px; border-top: 1px solid var(--border); }
  .scroll { overflow-x: auto; }
  .bars { display: flex; gap: 14px; align-items: flex-end; height: 180px; }
  .bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; justify-content: flex-end; height: 100%; }
  .bars .b div { width: 100%; max-width: 46px; background: var(--acc); border-radius: 8px 8px 0 0; min-height: 2px; }
  .muted { color: var(--muted); } .err { color: var(--bad); font-weight: 600; }
  .toastbtn { margin-left: 14px; background: #fff; color: var(--text); border: 0; border-radius: 8px; padding: 6px 12px; font: inherit; font-weight: 800; cursor: pointer; }
  .toast { position: fixed; right: 20px; bottom: 20px; background: var(--text); color: #fff; padding: 12px 16px; border-radius: 12px; font-weight: 600; z-index: 9; }
  .login { max-width: 400px; margin: 12vh auto; }
  .note { background: var(--accSoft); color: #134E4A; border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.5; }
  .progress { height: 6px; border-radius: 999px; background: var(--surf); overflow: hidden; } .progress div { height: 100%; background: var(--acc); }
  /* confirm popup before risky actions */
  .confirm { position: fixed; inset: 0; background: rgba(17,24,39,.5); display: grid; place-items: center; padding: 20px; z-index: 20; }
  .confirm .box { background: #fff; border-radius: 18px; padding: 22px; width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .confirm h3 { margin: 0; font-size: 18px; } .confirm p { margin: 0; color: var(--muted); line-height: 1.5; font-size: 14px; }
  .confirm .chk { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 600; padding: 10px 12px; background: #F9FAFB; border-radius: 10px; cursor: pointer; }
  .confirm .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .confirm .btn.risk { background: var(--bad); color: #fff; } .confirm .btn:disabled { opacity: .45; cursor: not-allowed; }
  [hidden] { display: none !important; }
  /* our own calendar: opens on any click, works inside any browser or frame */
  .dfield { height: 40px; border-radius: 12px; border: 1.5px solid var(--border); background: #fff; color: var(--text); font: inherit; font-weight: 600; padding: 0 12px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; }
  .dfield:hover, .dfield.open { border-color: var(--acc); } .dfield svg { color: var(--muted); }
  .dpop { position: absolute; z-index: 30; background: #fff; border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 16px 40px rgba(17,24,39,.18); padding: 12px; width: 300px; }
  .dpop .hd { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .dpop .hd select { height: 34px; flex: 1; padding: 0 6px; border-radius: 10px; }
  .dpop .nav { width: 34px; height: 34px; border-radius: 10px; border: 1.5px solid var(--border); background: #fff; color: var(--text); font: inherit; font-weight: 800; cursor: pointer; }
  .dpop .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .dpop .wd { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); padding: 4px 0; }
  .dpop .d { height: 36px; border: 0; border-radius: 10px; background: #fff; color: var(--text); font: inherit; font-size: 14px; cursor: pointer; }
  .dpop .d:hover { background: #F3F4F6; } .dpop .d.today { box-shadow: inset 0 0 0 1.5px var(--acc); }
  .dpop .d.sel { background: var(--acc); color: #fff; font-weight: 800; } .dpop .d:disabled { color: #C4C9D2; cursor: not-allowed; background: #fff; }
  .dpop .ft { display: flex; justify-content: space-between; margin-top: 8px; }
  .dpop .ft button { border: 0; background: none; color: var(--acc); font: inherit; font-weight: 700; cursor: pointer; padding: 6px; }
  /* phones: the menu becomes a slim strip at the top that scrolls sideways */
  @media (max-width: 700px) {
    .shell { flex-direction: column; flex-wrap: nowrap; } nav, main { width: 100%; min-width: 0; } main { padding: 18px 14px; }
    nav { position: sticky; top: 0; z-index: 6; flex: none; max-width: none; flex-direction: row; align-items: center; gap: 4px; padding: 8px 10px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); scrollbar-width: none; }
    nav::-webkit-scrollbar { display: none; }
    nav .brand, nav .me { padding: 0 6px 0 0; flex: none; } nav .brand > span:last-child, nav .me > span:last-child { display: none; }
    nav .item { flex: none; white-space: nowrap; padding: 8px 10px; } nav .spacer { display: none; } nav .badge { margin-left: 4px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===================================================================================
   LiveTeach teacher dashboard. All data goes through api(); DEMO answers with sample data
   until this page is connected to the server (/teacher/api/...).
   =================================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rupees = (p) => '₹' + Math.round((p || 0) / 100).toLocaleString('en-IN');
const ago = (ts) => { if (ts == null) return '—'; const s = (Date.now() - ms(ts)) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago'; if (s < 86400) return Math.floor(s / 3600) + ' h ago'; return Math.floor(s / 86400) + ' days ago'; };
// ---------- Date field with our own calendar popup ----------
// dateField('id', '2026-04-01') → a button; read it with dateVal('id'); it fires 'change' when a day is picked.
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const ymd = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const niceDate = (v) => { if (!v) return 'Choose date'; const [y, m, d] = v.split('-').map(Number); return String(d).padStart(2, '0') + ' ' + MONTHS[m - 1].slice(0, 3) + ' ' + y; };
const CAL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
function dateField(id, value, label = '') { return `<button type="button" class="dfield" id="${id}" data-v="${value || ''}" aria-haspopup="dialog" aria-label="${label || 'Date'}: ${niceDate(value)}">${CAL}<span>${niceDate(value)}</span></button>`; }
const dateVal = (id) => (document.getElementById(id) || {}).dataset?.v || '';
function setDate(id, v) { const b = document.getElementById(id); if (!b) return; b.dataset.v = v; b.querySelector('span').textContent = niceDate(v); b.setAttribute('aria-label', 'Date: ' + niceDate(v)); }
function closeCal() { document.querySelectorAll('.dpop').forEach((p) => p.remove()); document.querySelectorAll('.dfield.open').forEach((b) => b.classList.remove('open')); }
function openCal(btn) {
  closeCal(); btn.classList.add('open');
  const today = ymd(new Date()), cur = btn.dataset.v || today; let [vy, vm] = cur.split('-').map(Number); vm -= 1;
  const pop = document.createElement('div'); pop.className = 'dpop'; pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-label', 'Choose a date');
  const years = []; for (let y = new Date().getFullYear() + 1; y >= 2024; y--) years.push(y);
  const draw = () => {
    const first = new Date(vy, vm, 1), start = (first.getDay() + 6) % 7, days = new Date(vy, vm + 1, 0).getDate();
    let cells = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map((w) => `<span class="wd">${w}</span>`).join('') + '<span></span>'.repeat(start);
    for (let d = 1; d <= days; d++) { const v = ymd(new Date(vy, vm, d));
      cells += `<button type="button" class="d ${v === btn.dataset.v ? 'sel' : ''} ${v === today ? 'today' : ''}" data-day="${v}" ${v > today ? 'disabled title="Future date"' : ''}>${d}</button>`; }
    pop.innerHTML = `<div class="hd"><button type="button" class="nav" data-mv="-1" aria-label="Previous month">‹</button>
      <select data-m aria-label="Month">${MONTHS.map((m, i) => `<option value="${i}" ${i === vm ? 'selected' : ''}>${m}</option>`).join('')}</select>
      <select data-y aria-label="Year">${years.map((y) => `<option ${y === vy ? 'selected' : ''}>${y}</option>`).join('')}</select>
      <button type="button" class="nav" data-mv="1" aria-label="Next month">›</button></div><div class="grid">${cells}</div>
      <div class="ft"><button type="button" data-today>Today</button><button type="button" data-close>Close</button></div>`;
  };
  draw();
  pop.addEventListener('click', (e) => { e.stopPropagation();
    const mv = e.target.closest('[data-mv]'); if (mv) { vm += +mv.dataset.mv; if (vm < 0) { vm = 11; vy--; } if (vm > 11) { vm = 0; vy++; } return draw(); }
    const day = e.target.closest('[data-day]') || (e.target.closest('[data-today]') && { dataset: { day: today } });
    if (day) { setDate(btn.id, day.dataset.day); closeCal(); btn.focus(); btn.dispatchEvent(new Event('change', { bubbles: true })); return; }
    if (e.target.closest('[data-close]')) { closeCal(); btn.focus(); } });
  pop.addEventListener('change', (e) => { if (e.target.matches('[data-m]')) vm = +e.target.value; if (e.target.matches('[data-y]')) vy = +e.target.value; draw(); });
  document.body.append(pop);
  const r = btn.getBoundingClientRect(), w = 300;
  pop.style.left = Math.max(8, Math.min(r.left + scrollX, scrollX + innerWidth - w - 8)) + 'px';
  const below = r.bottom + 6 + pop.offsetHeight < innerHeight;
  pop.style.top = (below ? r.bottom + scrollY + 6 : r.top + scrollY - pop.offsetHeight - 6) + 'px';
  (pop.querySelector('.d.sel') || pop.querySelector('.d.today') || pop.querySelector('.d'))?.focus();
}
document.addEventListener('click', (e) => { const b = e.target.closest('.dfield'); if (b) { e.preventDefault(); return b.classList.contains('open') ? closeCal() : openCal(b); } if (!e.target.closest('.dpop')) closeCal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.querySelector('.dpop')) { const b = document.querySelector('.dfield.open'); closeCal(); b && b.focus(); } });
window.addEventListener('resize', closeCal);
// ---------- Ask before risky actions ----------
// Every delete / reject / disconnect / log out / build / money change asks first. "Cancel" has focus,
// Esc or a click outside also cancels — so a slip of the finger never changes anything.
// check: a tick box that must be ticked first (used for big bulk actions).
function ask({ title, text, ok = 'Yes', danger = false, check = '' }) {
  return new Promise((done) => {
    const m = document.createElement('div'); m.className = 'confirm'; m.setAttribute('role', 'alertdialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-label', title);
    m.innerHTML = `<div class="box"><h3>${esc(title)}</h3><p>${text}</p>${check ? `<label class="chk"><input type="checkbox" id="cfchk">${esc(check)}</label>` : ''}
      <div class="acts"><button type="button" class="btn ghost" data-c="0">Cancel</button><button type="button" class="btn ${danger ? 'risk' : 'primary'}" data-c="1" ${check ? 'disabled' : ''}>${esc(ok)}</button></div></div>`;
    const key = (e) => { if (e.key === 'Escape') { e.preventDefault(); close(false); } };
    const close = (v) => { m.remove(); document.removeEventListener('keydown', key, true); done(v); };
    m.onclick = (e) => { if (e.target === m) return close(false); const b = e.target.closest('[data-c]'); if (b && !b.disabled) close(b.dataset.c === '1'); };
    if (check) m.querySelector('#cfchk').onchange = (e) => { m.querySelector('[data-c="1"]').disabled = !e.target.checked; };
    document.addEventListener('keydown', key, true); document.body.append(m); m.querySelector('[data-c="0"]').focus();
  });
}
// Unsaved changes: a page sets GUARD = () => 'message' while something is typed but not saved.
let GUARD = null, HERE = location.hash;
const leaveOk = async () => { const msg = GUARD && GUARD(); if (!msg) return true;
  return ask({ title: 'Leave without saving?', text: esc(msg), ok: 'Leave without saving', danger: true }); };
window.addEventListener('beforeunload', (e) => { if (GUARD && GUARD()) { e.preventDefault(); e.returnValue = ''; } });
window.onhashchange = async () => {
  const target = location.hash;
  if (GUARD && GUARD()) { history.replaceState(null, '', HERE || '#'); if (!(await leaveOk())) return; GUARD = null; history.replaceState(null, '', target); }
  render();
};
function toast(m, actionLabel, action) {
  document.querySelectorAll('.toast').forEach((x) => x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = m;
  if (actionLabel) { const b = document.createElement('button'); b.textContent = actionLabel; b.className = 'toastbtn';
    b.onclick = () => { t.remove(); action(); }; t.append(b); }

function apiUpload(path, body, onProgress) {
  return new Promise((ok, bad) => {
    const x = new XMLHttpRequest(); x.open('POST', '/teacher' + path);
    x.setRequestHeader('Content-Type', 'application/json'); x.setRequestHeader('Authorization', 'Bearer ' + TOKEN);
    x.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(Math.round(e.loaded / e.total * 100)); };
    x.upload.onload = () => onProgress(100);
    x.onload = () => { let d = {}; try { d = JSON.parse(x.responseText); } catch {} x.status < 300 ? ok(d) : bad(new Error(d.detail || 'Upload failed (' + x.status + ')')); };
    x.onerror = () => bad(new Error('No connection — upload stopped'));
    x.send(JSON.stringify(body));
  });
}
let UPBUSY = false;
async function uploadFiles(files, extra) {
  files = [...files].filter((f) => /\.(pdf|docx|txt|md)$/i.test(f.name));
  if (!files.length) return toast('Upload PDF, Word (.docx) or text files');
  if (UPBUSY) return toast('Please wait — the last upload is still running');
  UPBUSY = true; GUARD = () => 'Files are still uploading. Leaving now stops the upload.';
  let p = document.getElementById('uppanel'); if (!p) { p = document.createElement('section'); p.id = 'uppanel'; p.className = 'card'; p.setAttribute('role', 'status'); p.setAttribute('aria-live', 'polite');
    p.style.cssText = 'position:fixed;right:20px;bottom:20px;width:380px;max-height:60vh;overflow:auto;z-index:15;gap:10px;box-shadow:0 16px 40px rgba(17,24,39,.18)'; document.body.append(p); }
  p.innerHTML = `<div class="row"><b id="upsum">Uploading 0 of ${files.length}</b><button type="button" class="btn ghost small" id="upx" hidden>Close</button></div>` +
    files.map((f, i) => `<div style="display:flex;flex-direction:column;gap:4px"><div class="row" style="gap:6px;flex-wrap:nowrap"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:13px">${esc(f.name)}</span><span class="muted" id="ups${i}" style="font-size:12px;white-space:nowrap">Waiting · ${kb(f.size)}</span></div><div class="progress"><div id="upb${i}" style="width:0"></div></div></div>`).join('');
  let ok = 0, fail = 0;
  for (const [i, file] of files.entries()) {
    const st = document.getElementById('ups' + i), bar = document.getElementById('upb' + i);
    const set = (txt, pct, color) => { st.textContent = txt; if (pct != null) bar.style.width = pct + '%'; if (color) { bar.style.background = color; st.style.color = color; } };
    try { set('Preparing…', 2);
      const r = await apiUpload('/library', { filename: file.webkitRelativePath || file.name, data_base64: await fileB64(file), ...extra },
        (pct) => set(pct < 100 ? `Uploading ${pct}%` : 'Reading & checking…', Math.max(2, Math.round(pct * 0.9))));
      const [label, color] = LSTAT[r.status] || [r.status, 'var(--ok)']; set((r.status === 'live' ? '✓ ' : '') + label + (r.pages ? ` · ${r.pages_read}/${r.pages} pages` : ''), 100, color); ok++;
    } catch (e) { set('✗ ' + e.message, 100, 'var(--bad)'); st.style.whiteSpace = 'normal'; fail++; }
    document.getElementById('upsum').textContent = `Uploading ${ok + fail} of ${files.length}`;
  }
  document.getElementById('upsum').textContent = fail ? `Done · ${ok} uploaded · ${fail} not uploaded` : `Done · all ${ok} uploaded`;
  const x = document.getElementById('upx'); x.hidden = false; x.onclick = () => p.remove();
  UPBUSY = false; GUARD = null; if (location.hash === '#library') render();
}

    ${p.status === 'unclear' ? `<div class="note" style="border-color:var(--warn)"><b>Text unclear: ${p.unclear_percent}% of letters came out broken.</b> Your teachers don’t use this file yet. If it reads fine, press “Text is fine, use it”. If not, fix it here and save, or upload a cleaner copy (a PDF made from Word / Google Docs, or the Word file). <button type="button" class="btn primary small" id="pacc">Text is fine, use it</button></div>` : ''}
    <textarea id="ptext" style="height:46vh;border-radius:12px;border:1.5px solid var(--border);padding:10px 14px;font:inherit" ${editable() ? '' : 'readonly'}>${esc(text)}</textarea>
    <div class="row"><span class="muted" id="pmore">${next != null ? `Showing ${text.length.toLocaleString('en-IN')} of ${p.total_chars.toLocaleString('en-IN')} letters` : 'Whole file shown'}</span>${next != null ? '<button type="button" class="btn ghost small" id="pload">Show more</button>' : ''}</div>`, 'Save changes');
  const box = [...document.querySelectorAll('.confirm')].pop();
  const load = box.querySelector('#pload');
  if (load) load.onclick = async () => { load.disabled = true;
    try { const m = await api('GET', `/library/${id}?offset=${next}`); text += m.text; next = m.next_offset; const ta = box.querySelector('#ptext'); ta.value = text; ta.readOnly = !editable();
      box.querySelector('#pmore').textContent = next != null ? `Showing ${text.length.toLocaleString('en-IN')} of ${p.total_chars.toLocaleString('en-IN')} letters` : 'Whole file shown';
      if (next == null) load.remove(); else load.disabled = false; } catch (e) { toast(e.message); load.disabled = false; } };
  const acc = box.querySelector('#pacc');
  if (acc) acc.onclick = async () => { try { await api('POST', `/library/${id}/accept`); box.remove(); toast('File is live now'); render(); } catch (e) { toast(e.message); } };
  const m = await pr;
  if (!m || !editable()) return;
  const val = m.querySelector('#ptext').value; if (val === text) return;
  try { await api('PUT', `/library/${id}/text`, { text: val }); toast('Saved'); render(); } catch (e) { toast(e.message); }
}

// ---------- shared pager ----------
function pager(total, offset, limit, attr) {
  const pages = Math.max(1, Math.ceil(total / limit)), cur = Math.floor(offset / limit) + 1;
  const nums = [...new Set([1, cur - 1, cur, cur + 1, pages])].filter((n) => n >= 1 && n <= pages).sort((a, b) => a - b);
  let out = '', last = 0;
  for (const n of nums) { if (n - last > 1) out += '<span class="muted">…</span>'; out += `<button type="button" class="${n === cur ? 'on' : ''}" ${attr}="${(n - 1) * limit}" aria-label="Page ${n}">${n}</button>`; last = n; }
  return `<div class="row"><span class="muted">Showing ${total ? offset + 1 : 0}–${Math.min(offset + limit, total)} of ${total.toLocaleString('en-IN')}</span>
    <div class="pager"><button type="button" ${attr}="${Math.max(0, offset - limit)}" ${cur === 1 ? 'disabled' : ''}>‹ Prev</button>${out}<button type="button" ${attr}="${offset + limit}" ${cur === pages ? 'disabled' : ''}>Next ›</button></div></div>`;
}

// report period: month / this year / last year / financial year (Apr–Mar) / custom dates — all in Indian time
const isoD = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const RPT = [['this_month', 'This month'], ['last_month', 'Last month'], ['month', 'Choose a month…'], ['this_year', 'This year (Jan–Dec)'], ['last_year', 'Last year'],
  ['this_fy', 'This financial year (Apr–Mar)'], ['last_fy', 'Last financial year'], ['custom', 'Custom dates…']];
const RQ = { kind: 'this_month', month: '', from: isoD(new Date(new Date().getFullYear(), new Date().getMonth(), 1)), to: isoD(new Date()) };
// the From/To dates always show the chosen period; picking a date yourself switches to "Custom dates"
function kindRange(kind) {
  const t = new Date(), y = t.getFullYear(), m = t.getMonth(), fy = m >= 3 ? y : y - 1;
  if (kind === 'month') { const [a, b] = (RQ.month || isoD(t).slice(0, 7)).split('-').map(Number); const end = new Date(a, b, 0); return [new Date(a, b - 1, 1), end > t ? t : end].map(isoD); }
  if (kind === 'custom') return [RQ.from, RQ.to];
  return { this_month: [new Date(y, m, 1), t], last_month: [new Date(y, m - 1, 1), new Date(y, m, 0)], this_year: [new Date(y, 0, 1), t], last_year: [new Date(y - 1, 0, 1), new Date(y - 1, 11, 31)],
    this_fy: [new Date(fy, 3, 1), t], last_fy: [new Date(fy - 1, 3, 1), new Date(fy, 2, 31)] }[kind].map(isoD);
}
function reportRange() {
  if (!RQ.from || !RQ.to) throw new Error('Choose both dates');
  if (RQ.to < RQ.from) throw new Error('“To” date is before “From” date');
  return [RQ.from, RQ.to];
}

async function download(fmt) {
  let range; try { range = reportRange(); } catch (e) { return toast(e.message); }
  const name = `liveteach-${range[0]}-to-${range[1]}.${fmt}`;
  const res = await fetch(`/teacher/report?date_from=${range[0]}&date_to=${range[1]}&format=${fmt}`, { headers: AUTH() });
  if (!res.ok) return toast('Could not create the report');
  const a = document.createElement('a'); a.href = URL.createObjectURL(await res.blob()); a.download = name; a.click();
}

function settingsView() {
  return shell('settings', `${head('Settings', 'Your profile and login.')}
    <section class="card"><div class="row" style="justify-content:flex-start;gap:16px">${D.me.avatar ? `<img class="av" style="width:64px;height:64px" src="${D.me.avatar}" alt="">` : ''}<div><b style="font-size:17px">${esc(D.me.name)}</b><div class="muted">Login: ${esc(D.me.login)}</div><div class="muted">App: ${esc(D.me.app)}</div></div></div>
      <span class="muted" style="font-size:12px">To change your app’s name, logo, prices or your share, contact Dhurina support. Your AI teachers are under “Teachers”.</span></section>
    ${D.me.must_change ? '<div class="note" style="border-color:var(--warn)"><b>Please choose your own password now.</b> The one-time password from Dhurina stops being needed after this.</div>' : ''}
    <section class="card"><h2>Change password</h2><div class="grid2"><label class="f">Current password<input id="p0" type="password" autocomplete="current-password"></label><label class="f">New password<input id="p1" type="password" autocomplete="new-password"></label></div>
      <div class="row"><span id="pm" class="muted"></span><button class="btn ghost" id="pb">Change password</button></div></section>`);
}

// ------------------------------- WIRING ------------------------------------------
function bind(view) {
  if (view === 'teachers') {
    $('#fadd').onclick = () => facultyDialog(null);
    $$('[data-fedit]').forEach((b) => b.onclick = () => facultyDialog(FAC.items.find((f) => f.id === +b.dataset.fedit)));
  }
  if (view === 'library') {
    const drop = $('#drop'), pick = $('#filepick'), extra = () => ({ faculty_id: +$('#ufac').value || null, allow_common: $('#uallow').checked });
    drop.onclick = () => pick.click(); drop.onkeydown = (e) => (e.key === 'Enter' || e.key === ' ') && pick.click();
    pick.onchange = () => { uploadFiles(pick.files, extra()); pick.value = ''; };
    $('#udir').onchange = (e) => { uploadFiles(e.target.files, extra()); e.target.value = ''; };
    drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); }; drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); uploadFiles(e.dataTransfer.files, extra()); };
    $$('[data-ls]').forEach((b) => b.onclick = () => { LIB.status = b.dataset.ls; render(); });
    $$('[data-asub],[data-afac]').forEach((sel) => sel.onchange = async () => {
      const id = sel.dataset.asub || sel.dataset.afac, tr = sel.closest('tr');
      const body = sel.dataset.afac ? { subject: null, faculty_id: +sel.value || null } : { subject: sel.value || null, faculty_id: null };
      if (!body.subject && !body.faculty_id) return;
      try { await api('PUT', '/library/' + id, body); toast('Saved'); render(); } catch (e) { toast(e.message); render(); } });
    $$('[data-prev]').forEach((b) => b.onclick = () => previewFile(b.dataset.prev));
    $$('[data-rechk]').forEach((b) => b.onclick = async () => { try { await api('POST', `/library/${b.dataset.rechk}/recheck`); render(); } catch (e) { toast(e.message); } });
    $$('[data-repl]').forEach((i) => i.onchange = async () => { const f = i.files[0]; if (!f) return;
      try { await api('POST', `/library/${i.dataset.repl}/replace`, { filename: f.name, data_base64: await fileB64(f) }); toast('File replaced'); render(); } catch (e) { toast(e.message); } });
    $$('[data-ldel]').forEach((b) => b.onclick = async () => {
      if (!(await ask({ title: 'Delete this file?', text: 'Your teachers stop using it at once. You would have to upload it again.', ok: 'Delete', danger: true }))) return;
      try { await api('DELETE', '/library/' + b.dataset.ldel); toast('Deleted'); render(); } catch (e) { toast(e.message); } });
  }
  if (view === 'safety') {
    let t; $('#fq').oninput = (e) => { clearTimeout(t); t = setTimeout(() => { FV.q = e.target.value; FV.offset = 0; render().then(() => $('#fq').focus()); }, 350); };
    $$('[data-fst]').forEach((b) => b.onclick = () => { FV.status = b.dataset.fst; FV.offset = 0; render(); });
    $$('[data-fp]').forEach((b) => b.onclick = () => { FV.offset = +b.dataset.fp; render(); });
    $$('[data-fs]').forEach((b) => b.onclick = () => showFlagged(b.dataset.fs));
  }
  if (view === 'style') {
    const S = D.style;
    $$('[data-p]').forEach((b) => b.onclick = () => { const k = b.dataset.p, i = S.personalities.indexOf(k);
      if (i >= 0) { if (S.personalities.length > 1) S.personalities.splice(i, 1); else return toast('Keep at least one personality'); }
      else if (S.personalities.length >= 3) return toast('Up to 3 personalities — remove one first'); else S.personalities.push(k);
      render(); });
    const styleNow = () => JSON.stringify([S.personalities, $$('[data-tx]').map((x) => x.value), $$('input[type=checkbox]').map((x) => x.checked)]);
    const styleStart = window.__styleStart && window.__styleKeep ? window.__styleStart : styleNow(); window.__styleStart = styleStart; window.__styleKeep = false;
    GUARD = () => ($('#ss') && styleNow() !== styleStart) ? 'Your Teaching Style changes are not saved yet.' : null;
    $$('[data-p]').forEach((b) => b.addEventListener('click', () => { window.__styleKeep = true; }, true));
    $('#ss').onclick = async () => {
      for (const k in S.teaching) { S.teaching[k].text = $(`[data-tx="${k}"]`).value; S.teaching[k].on = $(`[data-on="${k}"]`).checked; }
      $$('[data-it]').forEach((c) => S.interaction[c.dataset.it] = c.checked);
      $$('[data-av]').forEach((c) => S.avatar[c.dataset.av] = c.checked);
      await api('PUT', '/style', S); window.__styleStart = styleNow(); GUARD = () => ($('#ss') && styleNow() !== window.__styleStart) ? 'Your Teaching Style changes are not saved yet.' : null; toast('Style saved — your AI will follow it'); };
  }
  if (view === 'review') {
    const re = () => { RV.offset = 0; render(); };
    $$('[data-tab]').forEach((b) => b.onclick = async () => { if (!(await leaveOk())) return; RV.tab = b.dataset.tab; RV.sel.clear(); re(); });
    let t; $('#rq').oninput = (e) => { clearTimeout(t); t = setTimeout(() => { RV.q = e.target.value; re(); }, 350); };
    $('#ro').onchange = (e) => { RV.origin = e.target.value; re(); }; $('#rs').onchange = (e) => { RV.sort = e.target.value; re(); };
    $$('[data-rp]').forEach((b) => b.onclick = () => { RV.offset = +b.dataset.rp; render(); window.scrollTo(0, 0); });
    $$('[data-sel]').forEach((c) => c.onchange = () => { c.checked ? RV.sel.add(+c.dataset.sel) : RV.sel.delete(+c.dataset.sel); render(); });
    $('#all') && ($('#all').onchange = (e) => { RV.data.items.forEach((g) => e.target.checked ? RV.sel.add(g.ids[0]) : RV.sel.delete(g.ids[0])); render(); });
    const group = (key) => RV.data.items.find((g) => g.ids[0] === key);
    const decide = async (keys, action, answer, sure = false) => { const groups = keys.map((k) => group(k)).filter(Boolean);
      const people = groups.reduce((a, g) => a + (g.asked || g.ids.length), 0);
      if (!sure && (groups.length > 1 || action === 'reject')) {
        const many = groups.length > 1, big = groups.length >= 20;
        const ok = await ask(action === 'approve'
          ? { title: `Approve ${groups.length} answers?`, text: `These answers go to <b>${people.toLocaleString('en-IN')} students</b> and your AI will reuse them. Please make sure you have read them. You can undo for 10 seconds, or later from the Approved tab.`, ok: `Approve ${groups.length}`, check: big ? `I have checked these ${groups.length} answers` : '' }
          : { title: many ? `Reject ${groups.length} answers?` : 'Mark this answer as wrong?', danger: true, text: `Your AI will <b>not use ${many ? 'these answers' : 'this answer'}</b> again${many ? ` (asked by ${people.toLocaleString('en-IN')} students)` : ''}. You can undo it later from the Rejected tab.`, ok: many ? `Reject ${groups.length}` : 'Yes, it’s wrong', check: big ? `I have checked these ${groups.length} answers` : '' });
        if (!ok) return; }
      const r = await api('POST', '/review/bulk', { decisions: groups.map((g) => ({ ids: g.ids, action, answer })) });
      keys.forEach((k) => RV.sel.delete(k)); RV.editing = null; render();
      toast(`${r.updated} student answer${r.updated === 1 ? '' : 's'} ${action === 'approve' ? 'approved' : 'rejected'}`, 'Undo', async () => {
        for (const g of groups) await api('POST', '/review/undo', { ids: g.ids }); toast('Undone — back in Waiting'); render(); }); };
    $$('[data-undo]').forEach((b) => b.onclick = async () => {
      if (!(await ask({ title: 'Move back to Waiting?', text: RV.tab === 'approved' ? 'Students will <b>stop getting this answer</b> right away, until you approve it again.' : 'The answer goes back to Waiting so you can review it again.', ok: 'Move back' }))) return;
      const r = await api('POST', '/review/undo', { ids: group(+b.dataset.undo).ids }); toast(`${r.restored} answer${r.restored === 1 ? '' : 's'} moved back to Waiting`); render(); });
    $$('[data-fix]').forEach((b) => b.onclick = async () => {
      if (!(await ask({ title: 'Replace the approved answer?', text: 'Every student who asks this will get your new version from now on.', ok: 'Save new answer' }))) return;
      try { await api('PUT', '/verified/' + b.dataset.fix, { answer: $('#ed').value }); RV.editing = null; toast('Approved answer corrected — students get the new version'); render(); } catch (e) { toast(e.message); } });
    $('#bok') && ($('#bok').onclick = () => decide([...RV.sel], 'approve'));
    $('#bno') && ($('#bno').onclick = () => decide([...RV.sel], 'reject'));
    $$('[data-ok]').forEach((b) => b.onclick = () => decide([+b.dataset.ok], 'approve'));
    $$('[data-no]').forEach((b) => b.onclick = () => decide([+b.dataset.no], 'reject'));
    $$('[data-edit]').forEach((b) => b.onclick = () => { RV.editing = +b.dataset.edit; render(); });
    $$('[data-cancel]').forEach((b) => b.onclick = async () => { const g = group(RV.editing);
      if ($('#ed') && g && $('#ed').value !== g.answer && !(await ask({ title: 'Discard your changes?', text: 'The answer you were typing will be lost.', ok: 'Discard', danger: true }))) return;
      RV.editing = null; render(); });
    if (RV.editing != null) GUARD = () => { const g = group(RV.editing); return ($('#ed') && g && $('#ed').value !== g.answer) ? 'Your corrected answer is not saved yet.' : null; };
    $$('[data-save]').forEach((b) => b.onclick = () => decide([+b.dataset.save], 'approve', $('#ed').value));
  }
  if (view === 'students') {
    let t; $('#sq').oninput = (e) => { clearTimeout(t); t = setTimeout(() => { SV.q = e.target.value; SV.offset = 0; render().then(() => $('#sq').focus()); }, 350); };
    $$('[data-st]').forEach((b) => b.onclick = () => { SV.status = b.dataset.st; SV.offset = 0; render(); });
    $$('[data-sp]').forEach((b) => b.onclick = () => { SV.offset = +b.dataset.sp; render(); });
    const show = () => { [RQ.from, RQ.to] = kindRange(RQ.kind); setDate('rf', RQ.from); setDate('rt', RQ.to); $('#rp').value = RQ.kind; $('#rm').hidden = RQ.kind !== 'month'; };
    if (RQ.month) $('#rm').value = RQ.month;
    $('#rp').onchange = (e) => { RQ.kind = e.target.value; if (RQ.kind === 'month') RQ.month = $('#rm').value; show(); };
    $('#rm').onchange = (e) => { RQ.month = e.target.value; show(); };
    // a From after the To (or a To before the From) moves the other date so the range always makes sense
    $('#rf').addEventListener('change', () => { RQ.kind = 'custom'; RQ.from = dateVal('rf'); if (RQ.to < RQ.from) RQ.to = isoD(new Date()); show(); });
    $('#rt').addEventListener('change', () => { RQ.kind = 'custom'; RQ.to = dateVal('rt'); if (RQ.to < RQ.from) RQ.from = RQ.to; show(); });
    $('#rv').onclick = () => showReport();
    $$('[data-dl]').forEach((b) => b.onclick = () => download(b.dataset.dl));
  }
  if (view === 'settings') $('#pb').onclick = async () => {
    if (!$('#p0').value || !$('#p1').value) { $('#pm').textContent = 'Enter your current and new password'; $('#pm').className = 'err'; return; }
    if (!(await ask({ title: 'Change your password?', text: 'You will use the new password the next time you log in.', ok: 'Change password' }))) return;
    try { const r = await api('POST', '/password', { current_password: $('#p0').value, new_password: $('#p1').value });
      TOKEN = r.token; try { sessionStorage.setItem('lt_inst', TOKEN); } catch {}
      $('#pm').textContent = 'Password changed. Other devices are logged out.'; $('#pm').className = 'muted'; $('#p0').value = $('#p1').value = ''; } catch (e) { $('#pm').textContent = e.message; $('#pm').className = 'err'; } };
}

const VIEWS = { home: homeView, teachers: teachersView, library: libraryView, style: styleView, review: reviewView, students: studentsView, safety: safetyView, settings: settingsView };
async function render() {
  const app = $('#app');
  if (!TOKEN) {
    app.innerHTML = loginView();
    $('#lf').onsubmit = async (e) => { e.preventDefault(); try { const r = await api('POST', '/login', { login: $('#lg').value, password: $('#pw').value });
      TOKEN = r.token; try { sessionStorage.setItem('lt_inst', TOKEN); } catch {} location.hash = r.must_change ? '#settings' : '#home'; render(); } catch (err) { $('#lerr').textContent = err.message; } };
    return;
  }
  const h = (location.hash || '#home').slice(1);
  if (h === 'logout') {
    if (!(await ask({ title: 'Log out?', text: 'You will need your email or mobile and password to log in again.', ok: 'Log out' }))) { history.replaceState(null, '', HERE || '#home'); return; }
    TOKEN = ''; try { sessionStorage.removeItem('lt_inst'); } catch {} location.hash = ''; return render(); }
  GUARD = null; HERE = location.hash;
  try { D = await api('GET', '/home'); } catch (e) { if (TOKEN) app.innerHTML = `<p class="err" style="padding:30px">${esc(e.message)}</p>`; return; }
  const view = VIEWS[h] ? h : 'home';
  if (view === 'style') D.style = (await api('GET', '/style')).style;
  app.innerHTML = await VIEWS[view]();
  bind(view);
}
render();
</script>
