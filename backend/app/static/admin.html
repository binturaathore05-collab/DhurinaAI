<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveTeach · Dhurina Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F6F7F9; --panel:#FFFFFF; --surf:#F1F3F6; --border:#E3E6EB; --text:#111827; --muted:#5B6472;
          --acc:#0F766E; --accHover:#115E59; --warn:#B45309; --ok:#15803D; --bad:#B91C1C; }
  * { box-sizing: border-box; }
  /* Always light: stops phones/browsers in dark mode from turning control text white on our white boxes */
  :root { color-scheme: only light; }
  button, input, select, textarea, option { color: var(--text); }
  input:not([type=range]):not([type=checkbox]):not([type=radio]):not([type=color]), select, textarea, option { background-color: #fff; -webkit-text-fill-color: var(--text); }
  input:disabled, textarea:disabled, select:disabled { background-color: #F3F4F6; -webkit-text-fill-color: #5B6472; }
  input::placeholder, textarea::placeholder { color: #8A93A3; -webkit-text-fill-color: #8A93A3; opacity: 1; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14px; }
  a { color: var(--acc); } a:hover { color: var(--accHover); }
  .shell { display: flex; flex-wrap: wrap; min-height: 100vh; }
  nav { flex: 1 1 220px; max-width: 260px; background: #fff; border-right: 1px solid var(--border); padding: 26px 18px; display: flex; flex-direction: column; gap: 6px; }
  nav .brand { display: flex; gap: 10px; align-items: center; padding: 0 8px 22px; }
  nav .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--acc); color: #fff; display: grid; place-items: center; font-weight: 800; }
  nav a.item { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 14px; border-radius: 12px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 15px; }
  nav a.item.on { background: var(--surf); color: var(--text); }
  nav .spacer { flex: 1; }
  nav .navh { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 14px 14px 2px; }
  .hub { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .hub .card { gap: 8px; } .hub .num { color: var(--muted); font-size: 12px; font-weight: 700; }
  .fl td select { min-width: 0; } .fl td { vertical-align: middle; }
  main { flex: 999 1 560px; min-width: 0; padding: 30px 36px 48px; display: flex; flex-direction: column; gap: 22px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; } h2 { margin: 0; font-size: 17px; }
  .sub { color: var(--muted); font-size: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 12px; font: inherit; font-weight: 800; border: 0; cursor: pointer; text-decoration: none; }
  .btn.primary { background: var(--acc); color: #fff; } .btn.primary:hover { background: var(--accHover); color: #fff; }
  .btn.ghost { background: #fff; color: var(--text); border: 1.5px solid var(--border); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 1px 2px rgba(16,24,40,.05); padding: 22px; display: flex; flex-direction: column; gap: 16px; }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px; }
  .chart { display: flex; flex-direction: column; gap: 8px; }
  .dbars { display: flex; align-items: flex-end; gap: 2px; height: 120px; border-bottom: 1px solid var(--border); }
  .dcol { flex: 1 1 0; min-width: 2px; height: 100%; display: flex; align-items: flex-end; position: relative; outline: none; }
  .dfill { width: 100%; background: #0D9488; border-radius: 4px 4px 0 0; }
  .dcol:hover .dfill, .dcol:focus .dfill { background: #0F766E; }
  .dtip { display: none; position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: #111827; color: #fff; font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; z-index: 5; }
  .dcol:hover .dtip, .dcol:focus .dtip { display: block; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
  .stat { background: #fff; border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 1px 2px rgba(16,24,40,.05); padding: 18px; display: flex; flex-direction: column; gap: 6px; }
  .stat .k { color: var(--muted); font-size: 13px; } .stat .v { font-size: 26px; font-weight: 800; } .stat .n { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; min-width: 680px; }
  th { text-align: left; font-size: 12px; color: var(--muted); letter-spacing: .04em; padding: 10px 12px; }
  td { padding: 14px 12px; border-top: 1px solid var(--border); }
  .who { display: flex; align-items: center; gap: 12px; color: var(--text); text-decoration: none; }
  .av { width: 40px; height: 40px; border-radius: 999px; object-fit: cover; object-position: center 15%; background: var(--surf); flex: none; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; border: 1.5px solid currentColor; border-radius: 999px; padding: 3px 10px; }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 999px; background: currentColor; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 13px; }
  label.f span.h { font-weight: 400; color: var(--muted); font-size: 12px; }
  input[type=text], input[type=number], input[type=password], input[type=tel], input[type=email], input[type=search], textarea {
    height: 44px; border-radius: 12px; border: 1.5px solid var(--border); background: #fff; color: var(--text); padding: 0 14px; font: inherit; outline: none; }
  textarea { height: 84px; padding: 10px 14px; resize: vertical; }
  input:focus, textarea:focus { border-color: var(--acc); }
  .sec-h { display: flex; gap: 12px; align-items: flex-start; }
  .num { width: 28px; height: 28px; flex: none; border-radius: 999px; background: var(--surf); color: var(--acc); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { width: 38px; height: 38px; border-radius: 999px; border: 3px solid #fff; cursor: pointer; box-shadow: 0 0 0 1px var(--border); }
  .sw.on { box-shadow: 0 0 0 2px var(--text); }
  .more { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px 0 4px; border-radius: 999px; border: 1.5px solid var(--border); background: #fff; font-weight: 700; font-size: 13px; cursor: pointer; }
  .more input { width: 30px; height: 30px; border: 0; padding: 0; background: none; cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 44px; border: 1.5px solid var(--border); border-radius: 12px; background: #fff; padding: 6px 8px; }
  .chips:focus-within { border-color: var(--acc); }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: #E6F4F1; color: var(--acc); font-weight: 700; font-size: 13px; border-radius: 999px; padding: 4px 6px 4px 12px; }
  .chip button { border: 0; background: none; color: inherit; cursor: pointer; font-size: 16px; line-height: 1; width: 22px; height: 22px; border-radius: 999px; }
  .chips input { flex: 1; min-width: 140px; border: 0; height: 30px; padding: 0 4px; outline: none; font: inherit; }
  .sugg { display: flex; flex-wrap: wrap; gap: 6px; }
  .sugg button { border: 1px dashed var(--border); background: var(--surf); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; color: var(--muted); }
  .split { background: var(--surf); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .bar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--warn); }
  .bar > div { background: var(--acc); }
  .phone { width: 280px; height: 580px; border-radius: 38px; border: 8px solid #111827; background: #0B1220; color: #F1F5F9; overflow: hidden; display: flex; flex-direction: column; }
  .phone img { width: 100%; height: 280px; object-fit: cover; object-position: center 18%; border-radius: 0 0 22px 22px; background: #162033; }
  .phone .in { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .photo { display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 10px 14px; border-radius: 14px; border: 1.5px dashed var(--border); background: var(--surf); cursor: pointer; }
  .check { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 500; }
  .check input { width: 20px; height: 20px; accent-color: var(--acc); }
  .bars { display: flex; gap: 14px; align-items: flex-end; height: 190px; }
  .bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; justify-content: flex-end; height: 100%; }
  .bars .b > div:not(.stack) { width: 100%; max-width: 46px; background: var(--acc); border-radius: 8px 8px 0 0; min-height: 2px; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; }
  .presets button { height: 36px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--border); background: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .presets button.on { background: var(--text); color: #fff; border-color: var(--text); }
  input[type=date], select { height: 40px; border-radius: 12px; border: 1.5px solid var(--border); background: #fff; font: inherit; padding: 0 10px; }
  .pager { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .pager button { min-width: 38px; height: 36px; border-radius: 10px; border: 1.5px solid var(--border); background: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .pager button.on { background: var(--text); color: #fff; border-color: var(--text); } .pager button:disabled { opacity: .4; cursor: default; }
  .sbar { height: 8px; border-radius: 999px; background: var(--surf); overflow: hidden; min-width: 80px; } .sbar div { height: 100%; background: var(--acc); }
  .stack { width: 100%; max-width: 46px; display: flex; flex-direction: column-reverse; border-radius: 8px 8px 0 0; overflow: hidden; }
  .stack .t { background: #5EB5AA; } .stack .d { background: var(--acc); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); } .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  th.sort { cursor: pointer; } th.sort.on { color: var(--text); }
  .muted { color: var(--muted); } .err { color: var(--bad); font-weight: 600; }
  .toast { position: fixed; right: 20px; bottom: 20px; background: var(--text); color: #fff; padding: 12px 16px; border-radius: 12px; font-weight: 600; }
  .login { max-width: 380px; margin: 14vh auto; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .scroll { overflow-x: auto; }
  /* confirm popup before risky actions */
  .confirm { position: fixed; inset: 0; background: rgba(17,24,39,.5); display: grid; place-items: center; padding: 20px; z-index: 20; }
  .confirm .box { background: #fff; border-radius: 18px; padding: 22px; width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .confirm h3 { margin: 0; font-size: 18px; } .confirm p { margin: 0; color: var(--muted); line-height: 1.5; font-size: 14px; }
  .confirm .chk { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 600; padding: 10px 12px; background: #F9FAFB; border-radius: 10px; cursor: pointer; }
  .confirm .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .confirm .btn.risk { background: var(--bad); color: #fff; } .confirm .btn:disabled { opacity: .45; cursor: not-allowed; }
  [hidden] { display: none !important; }
  /* our own calendar: opens on any click, works inside any browser or frame */
  .dfield { height: 40px; border-radius: 12px; border: 1.5px solid var(--border); background: #fff; color: var(--text); font: inherit; font-weight: 600; padding: 0 12px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; }
  .dfield:hover, .dfield.open { border-color: var(--acc); } .dfield svg { color: var(--muted); }
  .dpop { position: absolute; z-index: 30; background: #fff; border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 16px 40px rgba(17,24,39,.18); padding: 12px; width: 300px; }
  .dpop .hd { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .dpop .hd select { height: 34px; flex: 1; padding: 0 6px; border-radius: 10px; }
  .dpop .nav { width: 34px; height: 34px; border-radius: 10px; border: 1.5px solid var(--border); background: #fff; color: var(--text); font: inherit; font-weight: 800; cursor: pointer; }
  .dpop .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .dpop .wd { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); padding: 4px 0; }
  .dpop .d { height: 36px; border: 0; border-radius: 10px; background: #fff; color: var(--text); font: inherit; font-size: 14px; cursor: pointer; }
  .dpop .d:hover { background: #F3F4F6; } .dpop .d.today { box-shadow: inset 0 0 0 1.5px var(--acc); }
  .dpop .d.sel { background: var(--acc); color: #fff; font-weight: 800; } .dpop .d:disabled { color: #C4C9D2; cursor: not-allowed; background: #fff; }
  .dpop .ft { display: flex; justify-content: space-between; margin-top: 8px; }
  .dpop .ft button { border: 0; background: none; color: var(--acc); font: inherit; font-weight: 700; cursor: pointer; padding: 6px; }
  /* phones: the menu becomes a slim strip at the top that scrolls sideways */
  @media (max-width: 700px) {
    .shell { flex-direction: column; flex-wrap: nowrap; } nav, main { width: 100%; min-width: 0; } main { padding: 18px 14px; }
    nav { position: sticky; top: 0; z-index: 6; flex: none; max-width: none; flex-direction: row; align-items: center; gap: 4px; padding: 8px 10px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); scrollbar-width: none; }
    nav::-webkit-scrollbar { display: none; }
    nav .brand, nav .me { padding: 0 6px 0 0; flex: none; } nav .brand > span:last-child, nav .me > span:last-child { display: none; }
    nav .item { flex: none; white-space: nowrap; padding: 8px 10px; } nav .spacer { display: none; } nav .badge { margin-left: 4px; }
    nav .navh { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = (sel, el = document) => el.querySelector(sel);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rupees = (paise) => '₹' + Math.round((paise || 0) / 100).toLocaleString('en-IN');
const ICON = {
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  data: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
  review: '<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/>',
  policy: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  dash: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  lab: '<path d="M9 3h6M10 3v6L4 19a1.5 1.5 0 0 0 1.3 2h13.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/><path d="M7 15h10"/>',
  audit: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  alert: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  hub: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  filter: '<path d="M3 4h18l-7 9v6l-4 2v-8z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
  back: '<path d="M15 18l-6-6 6-6"/>', build: '<path d="M3 21l9-9M14 7l3-3 3 3-3 3z"/>', out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
};
const icon = (n, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const COLORS = [['Teal','#2DD4BF'],['Blue','#60A5FA'],['Orange','#F59E0B'],['Pink','#F472B6'],['Lime','#A3E635'],['Violet','#A78BFA'],
  ['Red','#F87171'],['Yellow','#FACC15'],['Green','#4ADE80'],['Cyan','#22D3EE'],['Indigo','#818CF8'],['Rose','#FB7185'],['Amber','#FBBF24'],['Sky','#38BDF8'],['Gold','#EAB308'],['White','#E5E7EB']];
const SUBJECTS = ['Rajasthan GK','History','Geography','Polity','Economics','Science','Physics','Chemistry','Biology','Maths','Reasoning','English','Hindi','Current Affairs','Computer','REET','Patwari','RAS','SSC','Banking'];
const STATUS = { live: ['Live', 'var(--ok)'], building: ['Building app', 'var(--warn)'], draft: ['Draft', 'var(--muted)'] };

let KEY = (() => { try { return sessionStorage.getItem('adminToken') || ''; } catch { return ''; } })();
let ME = null;
let ALERTS = { open: 0, critical: 0 };   // B7: the bell count, refreshed every minute   // B5: who is logged in and what their role may do (the server checks it again on every request)
const can = (cap) => !!(ME && ME.caps.includes(cap));
// ---------- Date field with our own calendar popup ----------
// dateField('id', '2026-04-01') → a button; read it with dateVal('id'); it fires 'change' when a day is picked.
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const ymd = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const niceDate = (v) => { if (!v) return 'Choose date'; const [y, m, d] = v.split('-').map(Number); return String(d).padStart(2, '0') + ' ' + MONTHS[m - 1].slice(0, 3) + ' ' + y; };
const CAL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
function dateField(id, value, label = '') { return `<button type="button" class="dfield" id="${id}" data-v="${value || ''}" aria-haspopup="dialog" aria-label="${label || 'Date'}: ${niceDate(value)}">${CAL}<span>${niceDate(value)}</span></button>`; }
const dateVal = (id) => (document.getElementById(id) || {}).dataset?.v || '';
function setDate(id, v) { const b = document.getElementById(id); if (!b) return; b.dataset.v = v; b.querySelector('span').textContent = niceDate(v); b.setAttribute('aria-label', 'Date: ' + niceDate(v)); }
function closeCal() { document.querySelectorAll('.dpop').forEach((p) => p.remove()); document.querySelectorAll('.dfield.open').forEach((b) => b.classList.remove('open')); }
function openCal(btn) {
  closeCal(); btn.classList.add('open');
  const today = ymd(new Date()), cur = btn.dataset.v || today; let [vy, vm] = cur.split('-').map(Number); vm -= 1;
  const pop = document.createElement('div'); pop.className = 'dpop'; pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-label', 'Choose a date');
  const years = []; for (let y = new Date().getFullYear() + 1; y >= 2024; y--) years.push(y);
  const draw = () => {
    const first = new Date(vy, vm, 1), start = (first.getDay() + 6) % 7, days = new Date(vy, vm + 1, 0).getDate();
    let cells = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map((w) => `<span class="wd">${w}</span>`).join('') + '<span></span>'.repeat(start);
    for (let d = 1; d <= days; d++) { const v = ymd(new Date(vy, vm, d));
      cells += `<button type="button" class="d ${v === btn.dataset.v ? 'sel' : ''} ${v === today ? 'today' : ''}" data-day="${v}" ${v > today ? 'disabled title="Future date"' : ''}>${d}</button>`; }
    pop.innerHTML = `<div class="hd"><button type="button" class="nav" data-mv="-1" aria-label="Previous month">‹</button>
      <select data-m aria-label="Month">${MONTHS.map((m, i) => `<option value="${i}" ${i === vm ? 'selected' : ''}>${m}</option>`).join('')}</select>
      <select data-y aria-label="Year">${years.map((y) => `<option ${y === vy ? 'selected' : ''}>${y}</option>`).join('')}</select>

  (pop.querySelector('.d.sel') || pop.querySelector('.d.today') || pop.querySelector('.d'))?.focus();

// ---------- Ask before risky actions ----------
// Every delete / reject / disconnect / log out / build / money change asks first. "Cancel" has focus,
// Esc or a click outside also cancels — so a slip of the finger never changes anything.
// check: a tick box that must be ticked first (used for big bulk actions).
function ask({ title, text, ok = 'Yes', danger = false, check = '' }) {
  return new Promise((done) => {
    const m = document.createElement('div'); m.className = 'confirm'; m.setAttribute('role', 'alertdialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-label', title);
    m.innerHTML = `<div class="box"><h3>${esc(title)}</h3><p>${text}</p>${check ? `<label class="chk"><input type="checkbox" id="cfchk">${esc(check)}</label>` : ''}
      <div class="acts"><button type="button" class="btn ghost" data-c="0">Cancel</button><button type="button" class="btn ${danger ? 'risk' : 'primary'}" data-c="1" ${check ? 'disabled' : ''}>${esc(ok)}</button></div></div>`;
    const key = (e) => { if (e.key === 'Escape') { e.preventDefault(); close(false); } };
    const close = (v) => { m.remove(); document.removeEventListener('keydown', key, true); done(v); };
    m.onclick = (e) => { if (e.target === m) return close(false); const b = e.target.closest('[data-c]'); if (b && !b.disabled) close(b.dataset.c === '1'); };
    if (check) m.querySelector('#cfchk').onchange = (e) => { m.querySelector('[data-c="1"]').disabled = !e.target.checked; };
    document.addEventListener('keydown', key, true); document.body.append(m); m.querySelector('[data-c="0"]').focus();
  });
}
// Unsaved changes: a page sets GUARD = () => 'message' while something is typed but not saved.
let GUARD = null, HERE = location.hash;
const leaveOk = async () => { const msg = GUARD && GUARD(); if (!msg) return true;
  return ask({ title: 'Leave without saving?', text: esc(msg), ok: 'Leave without saving', danger: true }); };
window.addEventListener('beforeunload', (e) => { if (GUARD && GUARD()) { e.preventDefault(); e.returnValue = ''; } });
window.onhashchange = async () => {
  const target = location.hash;
  if (GUARD && GUARD()) { history.replaceState(null, '', HERE || '#'); if (!(await leaveOk())) return; GUARD = null; history.replaceState(null, '', target); }
  render();
};

async function api(method, path, body) {
  const res = await fetch('/admin/api' + path, { method, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + KEY }, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== '/login' && path !== '/password') { KEY = ''; ME = null; try { sessionStorage.removeItem('adminToken'); } catch {} render(); throw new Error(data.detail || 'Please log in again'); }
  if (!res.ok) throw new Error(data.detail || 'Something went wrong');
  return data;
}

    data.brand_color = color; data.platform_percent = 100 - +s.value; data.subjects = subjects; delete data.subject;
    if (id && +s.value !== oldSplit && !(await ask({ title: 'Change this teacher’s split?',
      text: `Teacher <b>${oldSplit}% → ${+s.value}%</b>, Dhurina <b>${100 - oldSplit}% → ${100 - +s.value}%</b>.<br>This applies to <b>new payments only</b>. Payments already made keep their old split.`,
      ok: 'Yes, change split' }))) return;
    if (build && !(await ask({ title: 'Save and build the app?', text: `A new version of <b>${esc(data.app_name || data.name)}</b> will be built (about 7 minutes). After testing, you upload it to the teacher’s Play Console.`, ok: 'Save & build' }))) return;
    if (photo) data.photo_base64 = photo;
    const btns = document.querySelectorAll('button[type=submit]'); btns.forEach((b) => b.disabled = true);
    try {
      const saved = id ? await api('PUT', '/teachers/' + encodeURIComponent(id), data) : await api('POST', '/teachers', data);
      if (build) { try { await api('POST', `/teachers/${encodeURIComponent(saved.id)}/build`); toast('Saved · app build started'); } catch (err) { toast('Saved · ' + err.message); } }
      else toast('Saved');
      GUARD = null; location.hash = '#/t/' + encodeURIComponent(saved.id);
    } catch (err) { $('#ferr').textContent = err.message; window.scrollTo(0, 0); }
    finally { btns.forEach((b) => b.disabled = false); }
  };
}

const fileB64 = (file) => new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',', 2)[1] || ''); r.onerror = () => bad(new Error('Could not read ' + file.name)); r.readAsDataURL(file); });
const kb = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
const LSTAT = { live: ['Live', 'var(--ok)'], pending: ['Pending check', 'var(--warn)'], blocked: ['Blocked (safety)', 'var(--bad)'], checking: ['Safety check again', 'var(--warn)'] };
const lpill = (s) => { const [t, c] = LSTAT[s] || [s, 'var(--muted)']; return `<span class="pill" style="color:${c};white-space:nowrap">${t}</span>`; };
const HOW = { upload: 'chosen at upload', name: 'from the file name', ai: 'found by AI', admin: 'set by admin' };
let FAC = { items: [], subjects: [] }, LIB = { status: '' };
function dialog(title, inner, ok = 'Save') {
  return new Promise((done) => {
    const m = document.createElement('div'); m.className = 'confirm'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-label', title);
    m.innerHTML = `<form class="box" style="max-width:620px;max-height:90vh;overflow:auto"><h3>${esc(title)}</h3>${inner}<span class="err" id="dlgerr" role="alert"></span>
      <div class="acts"><button type="button" class="btn ghost" data-c="0">Cancel</button>${ok ? `<button type="submit" class="btn primary">${esc(ok)}</button>` : ''}</div></form>`;
    const key = (e) => { if (e.key === 'Escape') { e.preventDefault(); close(null); } };
    const close = (v) => { m.remove(); document.removeEventListener('keydown', key, true); done(v); };
    m.onclick = (e) => { if (e.target === m || e.target.closest('[data-c="0"]')) close(null); };
    m.querySelector('form').onsubmit = (e) => { e.preventDefault(); close(m); };
    document.addEventListener('keydown', key, true); document.body.append(m); (m.querySelector('input,textarea,select') || m.querySelector('[data-c="0"]')).focus();
  });
}

function libBase(owner) { return owner === 'common' ? '/common' : `/teachers/${encodeURIComponent(owner)}/library`; }
async function uploadFiles(owner, files, extra, done) {
  let ok = 0, fail = [];
  for (const [i, file] of [...files].entries()) {
    toast(`Uploading ${i + 1} of ${files.length}: ${file.name}`);
    try { await api('POST', libBase(owner), { filename: file.webkitRelativePath || file.name, data_base64: await fileB64(file), ...extra }); ok++; }
    catch (e) { fail.push(file.name + ': ' + e.message); }
  }
  toast(`${ok} uploaded${fail.length ? ' · ' + fail.length + ' not uploaded' : ''}`);
  if (fail.length) await ask({ title: 'Some files were not uploaded', text: fail.map(esc).join('<br>'), ok: 'OK' });
  done();
}

function pagerHtml(total, offset, limit, attr) {
  const pages = Math.max(1, Math.ceil(total / limit)), cur = Math.floor(offset / limit) + 1;
  const nums = [...new Set([1, cur - 1, cur, cur + 1, pages])].filter((n) => n >= 1 && n <= pages).sort((a, b) => a - b);
  let out = '', last = 0;
  for (const n of nums) { if (n - last > 1) out += '<span class="muted">…</span>'; out += `<button type="button" class="${n === cur ? 'on' : ''}" ${attr}="${(n - 1) * limit}">${n}</button>`; last = n; }
  return `<div class="row"><span class="muted">Showing ${total ? offset + 1 : 0}–${Math.min(offset + limit, total)} of ${total.toLocaleString('en-IN')}</span><div class="pager">
    <button type="button" ${attr}="${Math.max(0, offset - limit)}" ${cur === 1 ? 'disabled' : ''}>‹ Prev</button>${out}<button type="button" ${attr}="${offset + limit}" ${cur === pages ? 'disabled' : ''}>Next ›</button></div></div>`;
}

function bindSettings() {

    catch (e) { $('#pwmsg').textContent = e.message; $('#pwmsg').className = 'err'; } };
  const read = () => { const o = {}; document.querySelectorAll('[data-sec]').forEach((el) => { o[el.dataset.sec + '.' + el.name] = el.value; }); return o; };
  let saved = read();
  GUARD = () => (document.body.contains($('#save')) && JSON.stringify(read()) !== JSON.stringify(saved)) ? 'Your settings changes are not saved yet.' : null;
  $('#save').onclick = async () => {
    const now = read(), changed = Object.keys(now).filter((k) => now[k] !== saved[k]);
    if (!changed.length) return toast('Nothing changed');
    const money = changed.filter((k) => ['company.linked_account', 'defaults.platform_percent'].includes(k));
    const labels = { 'company.linked_account': 'Dhurina Razorpay linked account', 'defaults.platform_percent': 'Default Dhurina share for new teachers' };
    if (!(await ask({ title: 'Save settings?', danger: money.length > 0,

        + `${changed.length} setting${changed.length > 1 ? 's' : ''} will change for the whole platform.`, ok: 'Save settings' }))) return;
    // B8: a change of the safety rules becomes a new policy version — say why (optional)
    const safetyChange = changed.some((k) => ['ai', 'safety', 'limits', 'age_groups', 'students'].includes(k.split('.')[0]));
    let note = '';
    if (safetyChange) { note = await textDialog('Why are the safety rules changing?', 'Reason (kept in the policy history)', 'Save new version', { required: false, hint: 'This saves a new version of the safety policy. It can be compared and rolled back in Safety policy.' }); if (note === null) return; }
    const out = { _note: note };
    document.querySelectorAll('[data-sec]').forEach((el) => {
      out[el.dataset.sec] = out[el.dataset.sec] || {};
      let v = el.value;
      if (el.tagName === 'TEXTAREA') v = v.split('\n').map((x) => x.trim()).filter(Boolean);
      else if (el.type === 'number') v = Number(v);
      const [k, sub] = el.name.split('.');   // "junior.strictness" → age_groups.junior.strictness
      if (sub) { out[el.dataset.sec][k] = out[el.dataset.sec][k] || {}; out[el.dataset.sec][k][sub] = v; }
      else out[el.dataset.sec][el.name] = v;
    });
    try { await api('PUT', '/settings', out); saved = read(); toast('Settings saved'); $('#serr').textContent = ''; } catch (e) { $('#serr').textContent = e.message; }
  };
}

const SACT = {
  warn: { label: 'Give a warning', ok: 'Give warning', text: 'The student can still learn; the app shows a warning.' },
  suspend: { label: 'Suspend for a while', ok: 'Suspend', text: 'Sir’s AI stops until the time ends. Notes, library and payments stay open.' },
  review: { label: 'Stop until reviewed', ok: 'Stop access', text: 'Sir’s AI and new payments stop until an admin unblocks. Notes stay open.' },
  disable: { label: 'Disable account', ok: 'Disable account', text: 'The student can’t log in or open anything, including notes. Use only after a proper review.', danger: true },
  unblock: { label: 'Unblock', ok: 'Unblock', text: 'The student can learn with Sir again straight away.' },
};
function actionDialog(action, reasons, name) {
  const a = SACT[action];
  return new Promise((done) => {
    const m = document.createElement('div'); m.className = 'confirm'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-label', a.label);
    m.innerHTML = `<form class="box"><h3>${esc(a.label)} · ${esc(name)}</h3><p>${esc(a.text)}</p>
      <label class="f">Reason<select id="ar" required><option value="">Choose a reason</option>${(action === 'unblock' ? ['Mistake by the system', 'Spoke to the student / parent', 'Time served', 'Other'] : reasons).map((r) => `<option>${esc(r)}</option>`).join('')}</select></label>
      ${action === 'suspend' ? `<label class="f">For how long<select id="ah"><option value="24">1 day</option><option value="72">3 days</option><option value="168">7 days</option><option value="720">30 days</option></select></label>` : ''}
      <label class="f">Remarks (only admins see this)<textarea id="am" maxlength="1000" placeholder="What happened, who you spoke to…"></textarea></label>
      <span class="err" id="ae"></span>
      <div class="acts"><button type="button" class="btn ghost" data-c="0">Cancel</button><button type="submit" class="btn ${a.danger ? 'risk' : 'primary'}">${esc(a.ok)}</button></div></form>`;
    const key = (e) => { if (e.key === 'Escape') { e.preventDefault(); close(null); } };
    const close = (v) => { m.remove(); document.removeEventListener('keydown', key, true); done(v); };
    m.onclick = (e) => { if (e.target === m || e.target.closest('[data-c="0"]')) close(null); };
    m.querySelector('form').onsubmit = (e) => { e.preventDefault(); const reason = m.querySelector('#ar').value;
      if (!reason) { m.querySelector('#ae').textContent = 'Choose a reason'; return; }
      close({ action, reason, remarks: m.querySelector('#am').value.trim(), hours: action === 'suspend' ? Number(m.querySelector('#ah').value) : null }); };
    document.addEventListener('keydown', key, true); document.body.append(m); m.querySelector('#ar').focus();
  });
}

}
function switchDialog(label, off) {
  return new Promise((done) => {
    const m = document.createElement('div'); m.className = 'confirm'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
    m.innerHTML = `<form class="box"><h3>${off ? 'Turn off' : 'Turn back on'}: ${esc(label)}?</h3>
      <p>${off ? 'This works immediately for every affected student.' : 'Students can use it again straight away. Only turn it back on after you have checked the problem is fixed.'}</p>
      <label class="f">${off ? 'What happened?' : 'What did you check?'}<textarea id="sr" maxlength="500" required placeholder="${off ? 'e.g. wrong answers about …' : 'e.g. asked 20 test questions, all answers fine'}"></textarea></label>
      ${off ? '' : '<label class="chk"><input type="checkbox" id="sc">I have checked that the problem is fixed</label>'}
      <span class="err" id="se"></span>
      <div class="acts"><button type="button" class="btn ghost" data-c="0">Cancel</button><button type="submit" class="btn ${off ? 'risk' : 'primary'}" ${off ? '' : 'disabled'}>${off ? 'Turn off now' : 'Turn back on'}</button></div></form>`;
    const key = (e) => { if (e.key === 'Escape') { e.preventDefault(); close(null); } };
    const close = (v) => { m.remove(); document.removeEventListener('keydown', key, true); done(v); };
    m.onclick = (e) => { if (e.target === m || e.target.closest('[data-c="0"]')) close(null); };
    if (!off) m.querySelector('#sc').onchange = (e) => { m.querySelector('[type=submit]').disabled = !e.target.checked; };
    m.querySelector('form').onsubmit = (e) => { e.preventDefault(); const r = m.querySelector('#sr').value.trim();
      if (!r) { m.querySelector('#se').textContent = off ? 'Write what happened' : 'Write what you checked'; return; } close(r); };
    document.addEventListener('keydown', key, true); document.body.append(m); m.querySelector('#sr').focus();
  });
}
function bindEmergency() {
  document.querySelectorAll('[data-key]').forEach((b) => b.onclick = async () => {
    const off = b.dataset.off === '1', reason = await switchDialog(b.dataset.label, off); if (!reason) return;
    try { await api('POST', '/emergency', { key: b.dataset.key, off, reason }); toast(off ? 'Switched off' : 'Back on');
      $('#app').innerHTML = await emergencyView(); bindEmergency(); } catch (e) { toast(e.message); }
  });
}

function textDialog(title, label, ok, { required = true, danger = false, hint = '' } = {}) {
  return new Promise((done) => {
    const m = document.createElement('div'); m.className = 'confirm'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
    m.innerHTML = `<form class="box"><h3>${esc(title)}</h3>${hint ? `<p>${esc(hint)}</p>` : ''}<label class="f">${esc(label)}<textarea id="tx" maxlength="2000"></textarea></label><span class="err" id="te"></span>
      <div class="acts"><button type="button" class="btn ghost" data-c="0">Cancel</button><button type="submit" class="btn ${danger ? 'risk' : 'primary'}">${esc(ok)}</button></div></form>`;
    const key = (e) => { if (e.key === 'Escape') { e.preventDefault(); close(null); } };
    const close = (v) => { m.remove(); document.removeEventListener('keydown', key, true); done(v); };
    m.onclick = (e) => { if (e.target === m || e.target.closest('[data-c="0"]')) close(null); };
    m.querySelector('form').onsubmit = (e) => { e.preventDefault(); const v = m.querySelector('#tx').value.trim();
      if (required && !v) { m.querySelector('#te').textContent = 'Please write something'; return; } close(v); };
    document.addEventListener('keydown', key, true); document.body.append(m); m.querySelector('#tx').focus();
  });
}
function resolveDialog(resolutions) {
  return new Promise((done) => {
    const m = document.createElement('div'); m.className = 'confirm'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
    m.innerHTML = `<form class="box"><h3>Close this case</h3><label class="f">Outcome<select id="rr"><option value="">Choose</option>${Object.entries(resolutions).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('')}</select></label>
      <label class="f">Resolution remarks<textarea id="rn" maxlength="2000" placeholder="What you found and what was done"></textarea></label><span class="err" id="re"></span>
      <div class="acts"><button type="button" class="btn ghost" data-c="0">Cancel</button><button type="submit" class="btn primary">Close case</button></div></form>`;
    const key = (e) => { if (e.key === 'Escape') { e.preventDefault(); close(null); } };
    const close = (v) => { m.remove(); document.removeEventListener('keydown', key, true); done(v); };
    m.onclick = (e) => { if (e.target === m || e.target.closest('[data-c="0"]')) close(null); };
    m.querySelector('form').onsubmit = (e) => { e.preventDefault(); const r = m.querySelector('#rr').value, n = m.querySelector('#rn').value.trim();
      if (!r || !n) { m.querySelector('#re').textContent = 'Choose an outcome and write remarks'; return; } close({ resolution: r, note: n }); };
    document.addEventListener('keydown', key, true); document.body.append(m); m.querySelector('#rr').focus();
  });
}

      ['Class', x.class_level || '—'], ['Teacher', x.teacher_name || '—'], ['Reviewer', x.assigned_to || '—'], ['Summary', x.summary], ['Outcome', x.resolution ? x.resolutions[x.resolution] : 'open'], ['Resolution remarks', x.resolution_note || ''], ['Closed by', (x.resolved_by || '') + ' ' + (x.resolved_at ? when(x.resolved_at) : '')]])}</table>

    <p class="m">Confidential — contains a minor's data. Share only with people who need it.</p><script>print()<\/script></body></html>`);

}

  const prov = { rules: 'Phrase rules only (no AI key on the server yet)', llm: 'AI safety checker + phrase rules', openai: 'OpenAI moderation + phrase rules' }[m.provider] || m.provider;
  const off = d.emergency.off;
  return shell('Safety Center', `<div class="row"><div><h1>AI Teacher Safety Center</h1><span class="sub">Every safety control in one place. Live status, last 24 hours where it says so.</span></div>${d.alerts_open && can('dashboard') ? `<a class="btn ghost" href="#/alerts">${icon('bell', 18)}${d.alerts_open} open alert${d.alerts_open > 1 ? 's' : ''}</a>` : ''}</div>
    <div class="hub">
    ${mod(1, 'Content safety', tag(d.filters.on === d.filters.total ? 'ok' : 'warn', `${d.filters.on}/${d.filters.total} filters on`), [`${d.filters.locked} child-protection filters are always on.`, d.filters.custom_messages ? `${d.filters.custom_messages} student message(s) changed by you.` : 'Student messages: built-in texts.'], '#/filters', 'settings_view')}
    ${mod(2, 'Age-based rules', tag('ok', 'On'), [Object.entries(d.age_groups).filter(([g]) => g !== 'primary').map(([g, l]) => `${AGE_SHORT[g]}: ${LVL[l]}`).join(' · '), 'From the class and “18 or older?” given at signup.'], '#/settings', 'settings_view', 'Change in Settings')}
    ${mod(3, 'Education only', tag('ok', 'Always on'), ['Sir answers only studies; other chat gets a polite “let’s study”.', `${d.education_only.blocked_topics} extra topic(s) blocked for everyone.`], '#/settings', 'settings_view', 'Change in Settings')}
    ${mod(4, 'Input & output checks', tag(m.provider === 'rules' ? 'bad' : m.failed_24h ? 'warn' : 'ok', m.provider === 'rules' ? 'Needs AI key' : m.failed_24h ? `${m.failed_24h} failed` : 'Working'), [prov + '.', `Every question and every answer is checked. ${m.stopped_24h} stopped in 24 h.`, 'If the check can’t run, nothing unchecked goes out.'], '#/safety-dash', 'dashboard')}
    ${mod(5, 'Warnings & blocking', tag(st.auto_block ? 'ok' : 'warn', st.auto_block ? 'Auto-block on' : 'Auto-block off'), [`Now: ${st.warning} warned · ${st.suspended} suspended · ${st.review} waiting for a decision.`], '#/safety', 'students')}
    ${mod(6, 'Safety dashboard', tag('info', 'Numbers & charts'), ['Questions, blocks, stopped answers, cases — by day and by teacher.'], '#/safety-dash', 'dashboard')}
    ${mod(7, 'Human review center', tag(d.review.high ? 'bad' : d.review.open ? 'warn' : 'ok', d.review.open ? `${d.review.open} open` : 'Nothing open'), [d.review.high ? `${d.review.high} high-priority case(s) — please look now.` : 'Upset students, harmful requests and stopped answers open cases by themselves.'], '#/review', 'evidence')}
    ${mod(8, 'AI identity protection', tag('ok', 'On'), [`${d.identity.sealed_answers} answers sealed with a reference code (LT-…).`, 'Check a screenshot or recording in Audit.'], '#/audit', 'audit')}
    ${mod(9, 'Voice, photo & file safety', tag('warn', 'Partly'), ['Voice: spoken questions become text on the phone and get the same checks.', 'Photo / file upload: not in the app yet (Phase C).'], '', '')}
    ${mod(10, 'Parent & student privacy', tag(pr.encrypted && (!rt || rt.ok) ? 'ok' : 'bad', pr.encrypted ? 'Encrypted' : 'Not encrypted'), [`${pr.consents} parent consent(s) by OTP.`, `Parent SMS: block ${pr.parent_block_sms ? 'on' : 'off'} · upset student ${{ off: 'off', manual: 'a person decides', auto: 'automatic' }[pr.parent_care_sms]}.`, rt ? `Backup restore test ${rt.ok ? 'passed' : 'FAILED'} ${when(rt.at)}.` : 'Backup restore not tested yet.'], can('data_admin') ? '#/data' : '#/filters', can('data_admin') ? 'data_admin' : 'settings_view')}
    ${mod(11, 'Safety testing lab', tag(d.tests.state === 'ready' ? 'ok' : d.tests.state === 'running' ? 'warn' : 'bad', { ready: 'Ready', running: 'Running', blocked: 'Launch blocked' }[d.tests.state]), [d.tests.why, d.tests.last ? `Last run ${when(d.tests.last.at)}: ${d.tests.last.total - d.tests.last.failed}/${d.tests.last.total} passed.` : ''], '#/tests', 'tests_view')}
    ${mod(12, 'Emergency switch', tag(off.length ? 'bad' : 'ok', off.length ? `${off.length} switched off` : 'All on'), [off.length ? off.map((o) => esc(o.key)).join(', ') : 'Stop all AI, one teacher’s AI, one model or one feature in one click.'], '#/emergency', 'emergency_view')}
    </div>`);
}

// ---------- B9: Content filters, messages students see, parent SMS ----------
async function filtersView() {
  const d = await api('GET', '/filters');
  const edit = can('settings_safety');
  const dis = (x) => (x || !edit) ? 'disabled' : '';
  const sel = (name, val, opts, locked) => `<select data-f="${name}" ${dis(locked)} aria-label="${name}">${opts.map(([v, l]) => `<option value="${v}" ${String(val) === String(v) ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  const rows = d.catalog.map((c) => { const f = d.filters[c.id], L = c.locked; return `<tr data-cat="${c.id}"><td><b>${esc(c.label)}</b>${L ? '<div class="muted" style="font-size:12px">Child protection · always on, serious, reviewed</div>' : ''}</td>
    <td>${sel('on', f.on, [[true, 'On'], [false, 'Off']], L)}</td>
    <td>${sel('level', f.level, [['age', 'As per age group'], ['strict', 'Strict'], ['medium', 'Medium'], ['relaxed', 'Relaxed']], c.id === 'self_harm')}</td>
    <td>${sel('severity', f.severity, [['auto', 'As the checker decides'], ['minor', 'Small problem'], ['serious', 'Serious']], L)}</td>
    <td>${sel('review', f.review, [[true, 'Open a case'], [false, 'No']], L)}</td></tr>`; }).join('');
  const LN = { en: 'English', hi: 'Hindi', 'hi-Latn': 'Hinglish', pa: 'Punjabi' };
  const msgs = Object.entries(d.messages).map(([k, m]) => `<div style="border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:8px"><b>${esc(m.name)}</b>${m.must.length ? `<span class="h muted" style="font-size:12px">Must keep: ${m.must.map((x) => `<code>${esc(x)}</code>`).join(', ')}</span>` : ''}
    <div class="grid2">${['hi', 'en', 'hi-Latn', 'pa'].map((l) => `<label class="f">${LN[l]}<textarea data-m="${k}" data-l="${l}" rows="3" ${dis(false)} placeholder="${esc(m.default[l] || m.default.en)}">${esc(m.custom[l] || '')}</textarea></label>`).join('')}</div></div>`).join('');
  const p = d.parents;
  return shell('Content filters', `<div class="row"><div><h1>Content filters</h1><span class="sub">What Sir blocks, what the student is told, and when a parent gets an SMS. Changes apply at once and become a new version in Safety policy.</span></div>${edit ? '<button class="btn primary" id="fsave">Save changes</button>' : '<span class="pill">View only</span>'}</div>
    <span id="ferr" class="err"></span>
    <section class="card"><div><h2>Filters</h2><span class="sub">Real study questions (biology, reproduction, health, history, science) are never blocked — in every setting. <b>Off</b> only stops checking students’ messages for that kind; Sir’s own answers are always checked for everything.</span></div>
      <div class="scroll"><table class="fl"><thead><tr><th>FILTER</th><th>ON</th><th>STRICTNESS</th><th>COUNTS AS</th><th>HUMAN REVIEW</th></tr></thead><tbody>${rows}</tbody></table></div>
      <span class="muted" style="font-size:12px">Counts as: how a hit moves the student on the warnings ladder (Settings → Student safety). Strictness “as per age group” uses Settings → Age groups.</span></section>
    <section class="card"><div><h2>Messages students see</h2><span class="sub">Leave a box empty to use the built-in text (shown in grey). Hindi and English are used most.</span></div>${msgs}</section>
    <section class="card"><div><h2>SMS to parents</h2><span class="sub">To the parent who gave consent by OTP. Never contains what the child wrote. Not sent for students 18 or older, and at most once a day per kind.</span></div>
      ${d.sms_ready ? '' : '<span class="err">The server has no SMS provider yet: messages are only written to the server log (like login codes on the demo).</span>'}
      <div class="grid2"><label class="f">When a student is suspended, stopped for review or disabled<select data-p="notify_block" ${dis(false)}><option value="true" ${p.notify_block ? 'selected' : ''}>Send SMS (recommended)</option><option value="false" ${p.notify_block ? '' : 'selected'}>Don’t send</option></select></label>
      <label class="f">When a student seems upset (care case)<select data-p="notify_care" ${dis(false)}>${[['manual', 'A person decides in the case (recommended)'], ['auto', 'Send automatically'], ['off', 'Never']].map(([v, l]) => `<option value="${v}" ${p.notify_care === v ? 'selected' : ''}>${l}</option>`).join('')}</select><span class="h">Sometimes the trouble is at home, so by default someone looks first and presses “Inform parent by SMS” in the case.</span></label>
      <label class="f">SMS language<select data-p="language" ${dis(false)}><option value="hi" ${p.language === 'hi' ? 'selected' : ''}>Hindi</option><option value="en" ${p.language === 'en' ? 'selected' : ''}>English</option></select></label></div></section>`);
}
function bindFilters() {
  if (!$('#fsave')) return;
  const read = () => {
    const filters = {}, messages = {}, parents = {};
    document.querySelectorAll('tr[data-cat]').forEach((tr) => { const o = {}; tr.querySelectorAll('[data-f]').forEach((el) => { o[el.dataset.f] = ['on', 'review'].includes(el.dataset.f) ? el.value === 'true' : el.value; }); filters[tr.dataset.cat] = o; });
    document.querySelectorAll('[data-m]').forEach((el) => { (messages[el.dataset.m] = messages[el.dataset.m] || {})[el.dataset.l] = el.value.trim(); });
    document.querySelectorAll('[data-p]').forEach((el) => { parents[el.dataset.p] = el.dataset.p === 'notify_block' ? el.value === 'true' : el.value; });
    return { filters, messages, parents };
  };
  let saved = JSON.stringify(read());
  GUARD = () => (document.body.contains($('#fsave')) && JSON.stringify(read()) !== saved) ? 'Your filter changes are not saved yet.' : null;
  $('#fsave').onclick = async () => {
    const now = read();
    if (JSON.stringify(now) === saved) return toast('Nothing changed');
    const offs = Object.entries(now.filters).filter(([, f]) => !f.on).map(([c]) => c);
    const note = await textDialog('Why are the safety rules changing?', 'Reason (kept in the policy history)', 'Save new version',
      { required: false, danger: offs.length > 0, hint: (offs.length ? `${offs.length} filter(s) will be OFF for students’ messages. ` : '') + 'This saves a new version of the safety policy and runs the safety tests again.' });
    if (note === null) return;
    try { await api('PUT', '/settings', { ...now, _note: note }); saved = JSON.stringify(read()); $('#ferr').textContent = ''; toast('Saved — new safety policy version'); }
    catch (e) { $('#ferr').textContent = e.message; }
  };
}

// ---------- Safety policy versions (B8) ----------
const PV = { a: null, b: null };
const fmtVal = (v) => Array.isArray(v) ? (v.length ? v.join(', ') : '(none)') : (v === true ? 'On' : v === false ? 'Off' : v ?? '—');
async function policyView() {
  const d = await api('GET', '/policy');
  const cur = d.items[0];
  if (PV.b === null) { PV.b = cur.id; PV.a = d.items[1] ? d.items[1].id : cur.id; }
  const cmp = PV.a !== PV.b ? await api('GET', `/policy/compare?a=${PV.a}&b=${PV.b}`) : { changes: [] };
  const opts = (sel) => d.items.map((v) => `<option value="${v.id}" ${sel === v.id ? 'selected' : ''}>v${v.id} · ${when(v.created_at)}${v.current ? ' (in use)' : ''}</option>`).join('');
  const ver = (v) => v.verified_run ? '<span class="pill" style="color:var(--ok)">Verified by tests</span>' : '<span class="pill">Not tested</span>';
  const rows = d.items.map((v) => `<tr><td><b>v${v.id}</b>${v.current ? ' <span class="pill" style="color:var(--acc)">In use</span>' : ''}</td><td>${when(v.created_at)}</td><td>${esc(v.created_by)}</td>
    <td style="max-width:360px">${esc(v.note || '')}</td><td>${v.changes == null ? 'first' : v.changes + ' change' + (v.changes === 1 ? '' : 's')}</td><td>${ver(v)}</td>
    <td style="text-align:right;white-space:nowrap">${v.changes ? `<button type="button" class="btn ghost" data-cmp="${v.id}">Compare with previous</button>` : ''}
      ${!v.current && v.fingerprint !== cur.fingerprint && can('settings_safety') ? `<button type="button" class="btn ghost" data-rb="${v.id}" data-ok="${v.verified_run ? 1 : 0}">Roll back to v${v.id}</button>` : ''}</td></tr>`).join('');
  const diffRows = cmp.changes.map((c) => `<tr><td><b>${esc(c.label)}</b></td><td>${c.added || c.removed ? `${(c.removed || []).map((x) => `<span class="pill" style="color:var(--bad)">− ${esc(x)}</span>`).join(' ')}` : esc(fmtVal(c.old))}</td>
    <td>${c.added || c.removed ? `${(c.added || []).map((x) => `<span class="pill" style="color:var(--ok)">+ ${esc(x)}</span>`).join(' ')}` : esc(fmtVal(c.new))}</td></tr>`).join('');
  return shell('Safety policy', `<div class="row"><div><h1>Safety policy</h1><span class="sub">Every change of the safety rules is a version: who changed what, when and why. Compare any two; roll back if a change went wrong.</span></div></div>
    <section class="card"><div class="row"><div><h2>In use: v${cur.id}</h2><span class="sub">${esc(cur.created_by)} · ${when(cur.created_at)} · ${esc(cur.note || '')}</span></div>${ver(cur)}</div>
      <span class="muted" style="font-size:13px">The rules: topics Sir must not answer, the warnings ladder, limits, age-group rules and the lowest class. Change them in Settings; a new version is saved by itself. A version is “verified” when the safety tests passed with it.</span></section>
    <section class="card"><h2>Compare</h2><div class="row" style="justify-content:flex-start;gap:10px;flex-wrap:wrap"><select id="pa" aria-label="Older version">${opts(PV.a)}</select><span class="muted">→</span><select id="pb" aria-label="Newer version">${opts(PV.b)}</select></div>
      <div class="scroll">${diffRows ? `<table><thead><tr><th>RULE</th><th>v${PV.a}</th><th>v${PV.b}</th></tr></thead><tbody>${diffRows}</tbody></table>` : '<p class="muted">No difference between these two versions.</p>'}</div></section>
    <section class="card"><h2>History</h2><div class="scroll"><table><thead><tr><th>VERSION</th><th>WHEN</th><th>BY</th><th>WHY</th><th>CHANGES</th><th>TESTS</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>`);
}
function bindPolicy() {
  const again = async () => { $('#app').innerHTML = await policyView(); bindPolicy(); };
  $('#pa').onchange = (e) => { PV.a = Number(e.target.value); again(); };
  $('#pb').onchange = (e) => { PV.b = Number(e.target.value); again(); };
  document.querySelectorAll('[data-cmp]').forEach((b) => b.onclick = async () => {
    const d = await api('GET', '/policy'); const i = d.items.findIndex((v) => v.id === Number(b.dataset.cmp));
    PV.b = d.items[i].id; PV.a = d.items[i + 1].id; again(); });
  document.querySelectorAll('[data-rb]').forEach((b) => b.onclick = async () => {
    const id = b.dataset.rb, verified = b.dataset.ok === '1';
    const note = await textDialog(`Roll back to v${id}?`, 'Why', 'Roll back', { danger: !verified, hint: (verified ? 'v' + id + ' passed the safety tests. ' : 'Careful: v' + id + ' was never verified by the safety tests. ') + 'Its rules become a new version and apply at once; the safety tests run again.' });
    if (note === null) return;
    try { await api('POST', `/policy/${id}/rollback`, { note }); toast('Rolled back to v' + id); PV.a = PV.b = null; again(); } catch (e) { toast(e.message); }
  });
}

// ---------- Alerts (B7) ----------
const ALV = { all: false };
const LV = { critical: ['Critical', 'var(--bad)'], high: ['High', 'var(--warn)'], medium: ['Info', 'var(--muted)'] };
async function alertsView() {
  const d = await api('GET', '/alerts' + (ALV.all ? '?all=true' : ''));
  ALERTS = { open: d.open, critical: d.critical };
  const rows = d.items.map((a) => `<tr><td>${pillOf(LV, a.level)}</td><td><b>${esc(a.title)}</b><div class="muted" style="font-size:12px;max-width:520px">${esc(a.body || '')}</div></td>
    <td>${when(a.at)}</td><td class="muted" style="font-size:12px">${a.emailed === 1 ? 'emailed' : a.emailed === -1 ? '<span style="color:var(--bad)">email failed</span>' : '—'}</td>
    <td style="text-align:right;white-space:nowrap">${a.link ? `<a class="btn ghost" href="${esc(a.link)}">Open</a>` : ''} ${a.ack_at ? `<span class="muted" style="font-size:12px">seen by ${esc(a.ack_by)}</span>` : `<button type="button" class="btn ghost" data-ack="${a.id}">Mark as seen</button>`}</td></tr>`).join('');
  return shell('Alerts', `<div class="row"><div><h1>Alerts</h1><span class="sub">Serious things the team should know at once. Most urgent first.</span></div>
      ${d.open ? '<button type="button" class="btn ghost" id="ackall">Mark all as seen</button>' : ''}</div>
    ${d.email_ready ? (d.settings.email_to.length ? `<span class="muted" style="font-size:13px">Emails go to ${esc(d.settings.email_to.join(', '))} (${esc(d.settings.email_level)}).</span>` : '<span class="muted" style="font-size:13px">No one gets emails yet — add addresses in Settings → Alerts.</span>')
      : '<section class="card" style="border-color:var(--warn);background:#FFFBEB"><span>Email is not set up on the server (SMTP), so alerts show only here. WhatsApp alerts need a WhatsApp Business provider.</span></section>'}
    <section class="card" style="gap:12px"><div class="presets"><button type="button" data-al="0" class="${ALV.all ? '' : 'on'}">New · ${d.open}</button><button type="button" data-al="1" class="${ALV.all ? 'on' : ''}">All</button></div>
      <div class="scroll">${rows ? `<table><thead><tr><th>LEVEL</th><th>WHAT</th><th>WHEN</th><th>EMAIL</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : '<p class="muted">Nothing new. All quiet.</p>'}</div></section>`);
}
function bindAlerts() {
  const again = async () => { $('#app').innerHTML = await alertsView(); bindAlerts(); };
  document.querySelectorAll('[data-al]').forEach((b) => b.onclick = () => { ALV.all = b.dataset.al === '1'; again(); });
  document.querySelectorAll('[data-ack]').forEach((b) => b.onclick = async () => { try { await api('POST', '/alerts/ack', { id: Number(b.dataset.ack) }); again(); } catch (e) { toast(e.message); } });
  if ($('#ackall')) $('#ackall').onclick = async () => { if (!(await ask({ title: 'Mark all alerts as seen?', text: 'Do this only after someone has looked at each one.', ok: 'Mark all' }))) return;
    try { await api('POST', '/alerts/ack', { id: null }); again(); } catch (e) { toast(e.message); } };
}
setInterval(async () => {   // keep the bell count fresh without reloading the page
  if (!KEY || !ME || !can('dashboard') || document.hidden) return;
  try { const a = await api('GET', '/alerts'); if (a.open !== ALERTS.open) { ALERTS = { open: a.open, critical: a.critical }; const b = $('#bell'); if (b) b.outerHTML = `<a class="item ${location.hash === '#/alerts' ? 'on' : ''}" href="#/alerts" id="bell">${icon('bell')}Alerts${a.open ? ` <span class="pill" style="margin-left:auto;color:${a.critical ? 'var(--bad)' : 'var(--warn)'}">${a.open}</span>` : ''}</a>`; } } catch {}
}, 60000);

// ---------- router ----------
async function render() {
  const app = $('#app');
  if (!KEY) {
    app.innerHTML = loginView();
    $('#eye').onclick = () => { const k = $('#key'); const show = k.type === 'password'; k.type = show ? 'text' : 'password'; $('#eye').textContent = show ? 'Hide' : 'Show'; };
    const go = async () => {
      try {
        const r = await api('POST', '/login', { email: $('#email').value, password: $('#key').value });
        KEY = r.token; try { sessionStorage.setItem('adminToken', KEY); } catch {} render();
      } catch (e) { $('#lerr').textContent = e.message; }
    };
    $('#lf').onsubmit = (e) => { e.preventDefault(); go(); }; $('#email').focus();
    return;
  }
  const h = location.hash || '#/';
  try {
    if (h === '#/logout') {
      if (!(await ask({ title: 'Log out?', text: 'You will need your email and password to log in again.', ok: 'Log out' }))) { history.replaceState(null, '', HERE || '#/'); return; }
      KEY = ''; ME = null; try { sessionStorage.removeItem('adminToken'); } catch {} location.hash = '#/'; return render(); }
    if (!ME) ME = await api('GET', '/me');
    if (ME.must_change) { app.innerHTML = firstPasswordView(); bindFirstPassword(); return; }
    if (h === '#/' && !can('teachers_view')) { location.hash = can('evidence') ? '#/review' : can('students') ? '#/safety' : '#/safety-dash'; return; }
    GUARD = null; HERE = h;
    if (can('dashboard')) { try { const a = await api('GET', '/alerts'); ALERTS = { open: a.open, critical: a.critical }; } catch {} }
    if (h === '#/team') { app.innerHTML = await teamView(); bindTeam(); }
    else if (h === '#/policy') { app.innerHTML = await policyView(); bindPolicy(); }
    else if (h === '#/center') { app.innerHTML = await centerView(); }
    else if (h === '#/filters') { app.innerHTML = await filtersView(); bindFilters(); }
    else if (h === '#/alerts') { app.innerHTML = await alertsView(); bindAlerts(); }
    else if (h === '#/data') { app.innerHTML = await dataView(); bindData(); }
    else if (h === '#/new') { app.innerHTML = await formView(null); bindForm(null); }
    else if (h.startsWith('#/edit/')) { const id = decodeURIComponent(h.slice(7)); app.innerHTML = await formView(id); bindForm(id); }
    else if (h.startsWith('#/t/')) { const id = decodeURIComponent(h.slice(4)); LIB.status = ''; app.innerHTML = await detailView(id); bindDetail(id); }
    else if (h === '#/settings') { app.innerHTML = await settingsView(); bindSettings(); }
    else if (h === '#/reports') { app.innerHTML = await reportsView(); bindReports(); }
    else if (h === '#/review') { $('#app').innerHTML = await reviewView(); bindReview(); }
    else if (h.startsWith('#/case/')) { const id = h.slice(7); $('#app').innerHTML = await caseView(id); bindCase(id); }
    else if (h === '#/safety-dash') { $('#app').innerHTML = await dashView(); bindDash(); }
    else if (h === '#/tests') { $('#app').innerHTML = await testsView(); bindTests(); }
    else if (h === '#/teacher-lab') { $('#app').innerHTML = await teacherLabView(); bindTeacherLab(); }
    else if (h === '#/common') { LIB.status = ''; app.innerHTML = await commonView(); loadLibrary('common'); }
    else if (h === '#/audit') { $('#app').innerHTML = await auditView(); bindAudit(); }
    else if (h === '#/emergency') { $('#app').innerHTML = await emergencyView(); bindEmergency(); }
    else if (h === '#/safety') { app.innerHTML = await safetyView(); bindSafety(); }
    else if (h.startsWith('#/s/')) { const id = decodeURIComponent(h.slice(4)); app.innerHTML = await studentView(id); bindStudent(id); }
    else {
      app.innerHTML = await teachersView();
      const q = $('#q'); if (q) q.oninput = () => document.querySelectorAll('tbody tr').forEach((r) => r.style.display = r.dataset.name.includes(q.value.toLowerCase()) ? '' : 'none');
    }
  } catch (e) { if (KEY) app.innerHTML = shell('', `<p class="err">${esc(e.message)}</p>`); }
}
render();
</script>
