name: liveteach
description: LiveTeach – AI personal teacher (white-label student app)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  razorpay_flutter: ^1.3.7
  share_plus: ^10.1.4
  printing: ^5.13.0   # shows saved notes PDFs inside the app (zoom, scroll)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/teacher/
